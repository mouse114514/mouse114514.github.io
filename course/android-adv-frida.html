<!DOCTYPE html>
<html><head><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Frida 入门</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0f1e;color:#e0e8f0;height:100vh;overflow:hidden}
.presentation { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px; }
.slide-inner{max-width:840px;width:100%;background:rgba(20,30,50,.6);border:1px solid rgba(255,180,50,.2);border-radius:28px;padding:44px 54px;box-shadow:0 0 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
.slide-title .slide-inner{text-align:center;background:rgba(20,30,50,.4);border-color:rgba(255,180,50,.15)}
.slide-title h1{font-size:clamp(32px,5vw,52px);font-weight:800;background:linear-gradient(135deg,#ffb432,#ffd580);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;margin-bottom:12px}
.slide-title .sub{font-size:18px;color:rgba(255,255,255,.4)}
.slide-title .lesson-num{font-size:14px;color:rgba(255,255,255,.25);margin-bottom:18px;letter-spacing:3px}
.slide h2{font-size:clamp(22px,3vw,32px);font-weight:700;color:#ffb432;margin-bottom:18px;border-bottom:1px solid rgba(255,180,50,.15);padding-bottom:10px}
.slide p{font-size:17px;line-height:1.8;margin-bottom:12px;color:rgba(255,255,255,.85)}
.slide ul{margin:8px 0 12px 20px}
.slide li{font-size:16px;line-height:1.7;margin-bottom:5px;color:rgba(255,255,255,.8)}
.slide li strong{color:#ffd580}
.slide .highlight-box{background:rgba(255,180,50,.08);border-left:4px solid #ffb432;padding:16px 20px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.slide .tip-box{background:rgba(255,200,0,.06);border-left:4px solid #ffc800;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;font-size:14px}
.slide pre{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 20px;margin:12px 0;overflow-x:auto;font-size:14px;line-height:1.6;color:#ffd580}
.nav-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:10px 20px;z-index:10}
.nav-bar button{background:0 0;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-bar .counter{font-size:14px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav-bar .back-link{color:rgba(255,255,255,.25);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar .back-link:hover{color:#fff;background:rgba(255,255,255,.06)}
@media(max-width:640px){.slide-inner{padding:24px 16px;max-height:90vh}.slide p{font-size:15px}.slide li{font-size:14px}.slide h2{font-size:20px}.slide-title h1{font-size:28px}.nav-bar{padding:8px 12px;gap:8px;bottom:14px}.slide-inner::-webkit-scrollbar{width:3px}}
    </style></head>

<body>
    <div class="presentation" id="presentation">
        <div class="slide slide-title" id="slideContainer"></div>
    </div>

    <div class="nav-bar"><a class="back-link" href="index.html">目录</a><button id="prevBtn">◀</button><span class="counter" id="counter">1 / 10</span><button id="nextBtn">▶</button></div>

    <script>
    const slidesData = [
        { html: `<div class="lesson-num">安卓逆向 · 进阶第试</div><h1>Frida 入门</h1><div class="sub">动态插桩：不用重打包，运行时改行为</div>`, cls: 'slide slide-title active' },

        { html: `<h2>Frida 是什么</h2><p>Frida 是一个<strong>动态插桩框架</strong>——不用反编译重打包，直接在 App 运行时注入 JS 脚本，修改任意 Java/Native 方法的行为。</p><div class="highlight-box"><strong>核心原理：</strong>Frida 在手机上跑一个服务端（frida-server），PC 通过 USB 连接，注入 JavaScript 到目标进程的内存空间执行。</div><p><strong>能做什么：</strong>改返回值、打印参数、调用任意方法、Hook Native 函数、绕过 Root 检测……</p>`, cls: 'slide' },

        { html: `<h2>安装与启动</h2><pre># PC 端
pip install frida-tools

# 手机端（已 Root）
# 1. 下载对应架构的 frida-server
#    https://github.com/frida/frida/releases
adb push frida-server-16.x.x-android-arm64 /data/local/tmp/fs
adb shell chmod 755 /data/local/tmp/fs
adb shell /data/local/tmp/fs &

# 验证连接
frida-ps -U</pre><div class="tip-box"><strong>未 Root？</strong>用 frida-gadget 注入方式，把 frida-gadget.so 塞进 APK 的 lib/ 目录，重打包签名后启动即可，不需要 frida-server。</div>`, cls: 'slide' },

        { html: `<h2>第一个 Hook 脚本</h2><pre>// hook.js
Java.perform(function() {
    // 获取目标类
    var MainActivity = Java.use("com.example.app.MainActivity");

    // 替换 isPaid() 方法的实现
    MainActivity.isPaid.implementation = function() {
        console.log("[*] isPaid() called, forcing true");
        return true;  // 无论原逻辑是什么，都返回 true
    };
});</pre><pre># 运行
frida -U com.example.app -l hook.js</pre><div class="highlight-box"><strong>流程：</strong>Java.perform 确保在 Java VM 就绪后执行 → Java.use 获取类引用 → implementation = 替换方法体</div>`, cls: 'slide' },

        { html: `<h2>Hook 带参数的方法</h2><pre>var Checker = Java.use("com.example.Checker");

// 同名方法可能有多个签名，用 overload 指定参数类型
Checker.verify.overload("java.lang.String", "int").implementation = function(pwd, type) {
    console.log("[*] verify called, pwd=" + pwd + " type=" + type);

    // 调用原方法获取真实结果
    var result = this.verify(pwd, type);
    console.log("[*] original result=" + result);

    // 修改：密码是 "123456" 时强制通过
    if (pwd === "123456") {
        return true;
    }
    return result;
};</pre><div class="tip-box">不知道参数类型？用 <code>Checker.verify.overloads</code> 列出所有重载签名。</div>`, cls: 'slide' },

        { html: `<h2>常用 API 速查</h2><pre># 获取类
var Cls = Java.use("com.example.Foo");

# 列出所有方法
console.log(JSON.stringify(Cls.class.getDeclaredMethods()));

# Hook 构造函数
Cls.$init.overload("android.content.Context").implementation = function(ctx) {
    this.$init(ctx);  // 调用原构造
    console.log("Constructor called with context");
};

# 调用静态方法
var result = Cls.staticMethod("arg1");

# 创建新对象
var obj = Cls.$new("arg1", 123);

# 获取/设置字段
var val = obj.fieldName.value;
obj.fieldName.value = "new value";</pre>`, cls: 'slide' },

        { html: `<h2>实战：绕过 SSL Pinning</h2><pre>// bypass_ssl.js
Java.perform(function() {
    var TrustManagerImpl = Java.use("com.android.org.conscrypt.TrustManagerImpl");
    TrustManagerImpl.verifyChain.implementation = function() {
        console.log("[*] SSL pinning bypassed");
        return arguments[0];  // 直接返回证书链，不验证
    };

    // 也绕过 OkHttp 的 CertificatePinner
    try {
        var CertPinner = Java.use("okhttp3.CertificatePinner");
        CertPinner.check.overload("java.lang.String", "java.util.List").implementation = function() {
            console.log("[*] OkHttp pinning bypassed");
        };
    } catch(e) {}
});</pre><pre>frida -U -f com.example.app -l bypass_ssl.js --no-pause</pre>`, cls: 'slide' },

        { html: `<h2>实战：打印所有 Log</h2><pre>// logcat_hook.js
Java.perform(function() {
    var Log = Java.use("android.util.Log");

    Log.d.overload("java.lang.String", "java.lang.String").implementation = function(tag, msg) {
        console.log("[D] " + tag + ": " + msg);
        return this.d(tag, msg);
    };

    Log.e.overload("java.lang.String", "java.lang.String").implementation = function(tag, msg) {
        console.log("[E] " + tag + ": " + msg);
        return this.e(tag, msg);
    };

    Log.i.overload("java.lang.String", "java.lang.String").implementation = function(tag, msg) {
        console.log("[I] " + tag + ": " + msg);
        return this.i(tag, msg);
    };
});</pre>`, cls: 'slide' },

        { html: `<h2>实战：Hook Native 方法</h2><pre>// hook_native.js
Interceptor.attach(Module.findExportByName("libnative.so", "Java_com_example_NativeLib_check"), {
    onEnter: function(args) {
        // args[0] = JNIEnv, args[1] = jobject, args[2+] = Java 参数
        console.log("[*] Native check() called");
        console.log("    arg2 (string): " + args[2].readCString());
    },
    onLeave: function(retval) {
        console.log("[*] Native check() returned: " + retval.toInt32());
        retval.replace(1);  // 修改返回值为 1 (true)
    }
});</pre><div class="highlight-box"><strong>Native Hook 关键：</strong>Module.findExportByName(库名, 函数名) 找到函数地址，Interceptor.attach 挂钩。</div>`, cls: 'slide' },

        { html: `<h2>常用命令汇总</h2><pre># 列出设备进程
frida-ps -U
frida-ps -Uai   # 只看已安装的 App

# 附加到运行中的进程
frida -U com.example.app -l script.js

# 启动 App 并注入（推荐，能 hook 到初始化阶段）
frida -U -f com.example.app -l script.js --no-pause

# REPL 交互模式
frida -U com.example.app
# 进入后可以直接写 JS 调用 Java 方法</pre><div class="tip-box"><strong>调试技巧：</strong>REPL 模式下用 <code>Java.perform(function(){ ... })</code> 包裹代码，可以实时测试 Hook 是否生效。</div>`, cls: 'slide' }
    ];
    let current = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('counter');

    function goTo(n) {
        current = (n + slidesData.length) % slidesData.length;
        container.className = slidesData[current].cls;
        container.innerHTML = slidesData[current].html;
        counter.textContent = (current + 1) + ' / ' + slidesData.length;
    }
    goTo(0);

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    });
    document.getElementById('presentation').addEventListener('click', (e) => {
        if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return;
        goTo(current + 1);
    });
    </script>
</body>
</html>
