<!DOCTYPE html>
<html><head><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Smali 基础</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0f1e;color:#e0e8f0;height:100vh;overflow:hidden}
.presentation { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px; }
.slide-inner{max-width:840px;width:100%;background:rgba(20,30,50,.6);border:1px solid rgba(77,168,255,.2);border-radius:28px;padding:44px 54px;box-shadow:0 0 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
.slide-title .slide-inner{text-align:center;background:rgba(20,30,50,.4);border-color:rgba(77,168,255,.15)}
.slide-title h1{font-size:clamp(32px,5vw,52px);font-weight:800;background:linear-gradient(135deg,#4da8ff,#b0e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;margin-bottom:12px}
.slide-title .sub{font-size:18px;color:rgba(255,255,255,.4)}
.slide-title .lesson-num{font-size:14px;color:rgba(255,255,255,.25);margin-bottom:18px;letter-spacing:3px}
.slide h2{font-size:clamp(22px,3vw,32px);font-weight:700;color:#4da8ff;margin-bottom:18px;border-bottom:1px solid rgba(77,168,255,.15);padding-bottom:10px}
.slide p{font-size:17px;line-height:1.8;margin-bottom:12px;color:rgba(255,255,255,.85)}
.slide ul{margin:8px 0 12px 20px}
.slide li{font-size:16px;line-height:1.7;margin-bottom:5px;color:rgba(255,255,255,.8)}
.slide li strong{color:#b0e0ff}
.slide .highlight-box{background:rgba(77,168,255,.08);border-left:4px solid #4da8ff;padding:16px 20px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.slide .tip-box{background:rgba(255,200,0,.06);border-left:4px solid #ffc800;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;font-size:14px}
.slide pre{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 20px;margin:12px 0;overflow-x:auto;font-size:14px;line-height:1.6;color:#b0e0ff}
.nav-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:10px 20px;z-index:10}
.nav-bar button{background:0 0;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-bar .counter{font-size:14px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav-bar .back-link{color:rgba(255,255,255,.25);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar .back-link:hover{color:#fff;background:rgba(255,255,255,.06)}
@media(max-width:640px){.slide-inner{padding:24px 16px;max-height:90vh}.slide p{font-size:15px}.slide li{font-size:14px}.slide h2{font-size:20px}.slide-title h1{font-size:28px}.nav-bar{padding:8px 12px;gap:8px;bottom:14px}.slide-inner::-webkit-scrollbar{width:3px}}
    </style></head>

<body>
    <div class="presentation" id="presentation">
        <div class="slide slide-title" id="slideContainer"></div>
    </div>

    <div class="nav-bar"><a class="back-link" href="index.html">目录</a><button id="prevBtn">◀</button><span class="counter" id="counter">1 / 10</span><button id="nextBtn">▶</button></div>

    <script>
    const slidesData = [
        { html: `<div class="lesson-num">安卓逆向 · 第试</div><h1>Smali 基础</h1><div class="sub">安卓的汇编语言 —— 从语法到实战</div>`, cls: 'slide slide-title active' },

        { html: `<h2>什么是 Smali</h2><p>Smali 是 <strong>Android Dalvik/ART 虚拟机</strong>的汇编语言。你反编译 APK 后看到的 .smali 文件，就是机器码的文本表示。</p><div class="highlight-box"><strong>工具链：</strong>apktool 反编译 → 编辑 .smali → apktool 回编译 → jarsigner/apksigner 签名 → 安装</div><p>每一行 Smali 对应一条 Dalvik 指令，没有花括号、没有缩进陷阱——一切都很"机械"。</p>`, cls: 'slide' },

        { html: `<h2>类声明：.class / .super / .source</h2><p>每个 .smali 文件开头声明类信息：</p><pre>.class public Lcom/example/app/MainActivity;
.super Landroid/app/Activity;
.source "MainActivity.java"</pre><ul><li><code>.class</code> → 类的完整路径，<code>L</code> 开头 + <code>;</code> 结尾</li><li><code>.super</code> → 父类（继承关系）</li><li><code>.source</code> → 原始 Java 文件名（可选）</li></ul><div class="tip-box"><strong>记住：</strong><code>L</code> 表示这是一个对象类型，<code>[</code> 表示数组。例如 <code>[I</code> = int[]，<code>[Ljava/lang/String;</code> = String[]</div>`, cls: 'slide' },

        { html: `<h2>字段（成员变量）</h2><p>声明字段用 <code>.field</code>：</p><pre>.field private name:Ljava/lang/String;
.field public count:I
.field static sInstance:Lcom/example/App;</pre><p>格式：<code>.field [修饰符] 字段名:类型签名</code></p><p><strong>类型签名对照表：</strong></p><ul><li><code>I</code> = int &nbsp; <code>F</code> = float &nbsp; <code>Z</code> = boolean &nbsp; <code>B</code> = byte</li><li><code>J</code> = long &nbsp; <code>D</code> = double &nbsp; <code>C</code> = char &nbsp; <code>S</code> = short</li><li><code>V</code> = void（仅用于方法返回值）</li><li><code>Lfully/qualified/Name;</code> = 对象类型</li></ul>`, cls: 'slide' },

        { html: `<h2>寄存器模型</h2><p>Smali 使用 <strong>虚拟寄存器</strong>，不是真 CPU 寄存器。每个方法有自己的寄存器空间。</p><pre>.locals 2    # 本地寄存器数量（v0, v1）
.param p1    # 第1个参数（非 static 方法 p0 = this）
.param p2    # 第2个参数</pre><div class="highlight-box"><strong>关键规则：</strong><br><code>v0, v1, v2...</code> → 本地寄存器，方法内部随便用<br><code>p0, p1, p2...</code> → 参数寄存器，p0 永远是 this（非 static 方法）</div><p><code>.registers N</code> = 本地 + 参数的总数。例如 <code>.locals 2</code> + 2个参数 = <code>.registers 4</code></p>`, cls: 'slide' },

        { html: `<h2>方法声明</h2><p>每个方法（函数）的格式：</p><pre>.method public onClick(Landroid/view/View;)V
    .locals 2
    # ... 方法体 ...
.end method</pre><p>格式：<code>.method [修饰符] 方法名(参数列表)返回值类型</code></p><div class="tip-box"><strong>返回值类型：</strong><code>V</code> = void，其他同字段签名。<br><strong>参数类型：</strong>连续写，无分隔。例如 <code>(Landroid/content/Context;Ljava/lang/String;I)Z</code> 表示接收 Context、String、int，返回 boolean。</div><p>无参数方法：<code>()V</code> 或 <code>()Z</code>（无参返回 boolean）</p>`, cls: 'slide' },

        { html: `<h2>常用指令速查</h2><pre># 赋值
const/4 v0, 0x1        # v0 = 1
const-string v0, "hi"  # v0 = "hi"

# 数学
add-int v0, v1, v2     # v0 = v1 + v2
mul-int/2addr v0, v1   # v0 = v0 * v1
neg-int v0, v1         # v0 = -v1

# 比较
if-lt p1, v0, :fail    # if (p1 < v0) goto :fail
if-eqz v0, :zero       # if (v0 == 0) goto :zero

# 跳转
goto :label             # 无条件跳转
:label                 # 标签（跳转目标）

# 方法调用
invoke-virtual {}, Landroid/widget/Toast;->show()V
invoke-static {}, Lcom/Util;->getVersion()Ljava/lang/String;
invoke-direct {p0}, Lcom/Foo;->init()V</pre>`, cls: 'slide' },

        { html: `<h2>方法调用：四种 invoke</h2><ul><li><strong>invoke-virtual</strong> → 普通虚方法调用（最常用）</li><li><strong>invoke-static</strong> → 静态方法调用</li><li><strong>invoke-direct</strong> → 构造函数、private 方法、super 调用</li><li><strong>invoke-interface</strong> → 接口方法调用</li></ul><pre># 传参：花括号里放寄存器，顺序与参数列表对应
invoke-virtual {p0, p1, v0}, Lcom/Foo;->send(Ljava/lang/String;I)V
#                        ^      ^  ^
#                     this  param1 param2</pre><div class="highlight-box"><strong>move-result</strong>：调用有返回值的方法后，用 <code>move-result v0</code> 获取结果。</div>`, cls: 'slide' },

        { html: `<h2>实战：修改方法返回值</h2><p>场景：绕过 <code>isPaid()</code> 付费检测</p><pre># 原始 Smali
invoke-virtual {p0}, Lcom/app/Checker;->isPaid()Z
move-result v0
if-eqz v0, :not_paid   # if (!isPaid) goto not_paid
:paid
    # 正常逻辑...
goto :end
:not_paid
    # 显示"请付费"...
:end</pre><p><strong>改法一：</strong>把 <code>if-eqz</code> 改成 <code>if-nez</code>（条件反转）</p><p><strong>改法二：</strong>直接在 <code>move-result</code> 后加 <code>const/4 v0, 0x1</code>（强制返回 true）</p><div class="tip-box">改完后：apktool b → jarsigner 签名 → 安装测试</div>`, cls: 'slide' },

        { html: `<h2>实战：跳过登录验证</h2><p>场景：登录函数里找到验证逻辑</p><pre>.method public checkLogin(Ljava/lang/String;Ljava/lang/String;)Z
    .locals 3
    invoke-virtual {p1}, Lcom/app/Validator;->check(Ljava/lang/String;)Z
    move-result v0
    if-eqz v0, :fail      # 验证失败
    const/4 v0, 0x1        # return true
    return v0
:fail
    const/4 v0, 0x0        # return false
    return v0
.end method</pre><p><strong>改法：</strong>删掉 invoke + if-eqz，直接写：</p><pre>    const/4 v0, 0x1
    return v0</pre><div class="highlight-box">原理：让方法永远返回 true，跳过真实验证</div>`, cls: 'slide' },

        { html: `<h2>实用技巧与工具</h2><ul><li><strong>smali 语法搜索：</strong>JADX 反编译后搜关键字符串（如 "isPaid"、"password"）</li><li><strong>JEB Decompiler：</strong>付费工具，反编译质量更高，支持交叉引用</li><li><strong>Frida hook：</strong>动态验证你的修改是否生效</li></ul><div class="highlight-box"><strong>调试流程：</strong><br>1. 反编译找目标方法（grep 关键字符串）<br>2. 定位关键 if/return<br>3. 修改逻辑<br>4. 回编译 + 签名<br>5. 安装测试<br>6. 用 Frida 验证运行时行为</div><div class="tip-box">常见陷阱：方法参数数量变多了要同步改 <code>.registers</code>，否则运行时 crash。</div>`, cls: 'slide' }
    ];
    let current = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('counter');

    function goTo(n) {
        current = (n + slidesData.length) % slidesData.length;
        container.className = slidesData[current].cls;
        container.innerHTML = slidesData[current].html;
        counter.textContent = (current + 1) + ' / ' + slidesData.length;
    }
    goTo(0);

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    });
    document.getElementById('presentation').addEventListener('click', (e) => {
        if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return;
        goTo(current + 1);
    });
    </script>
</body>
</html>
