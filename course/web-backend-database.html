<!DOCTYPE html>
<html><head><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>数据库基础</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0f1e;color:#e0e8f0;height:100vh;overflow:hidden}
.presentation { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px; }
.slide-inner{max-width:840px;width:100%;background:rgba(20,30,50,.6);border:1px solid rgba(77,168,255,.2);border-radius:28px;padding:44px 54px;box-shadow:0 0 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
.slide-title .slide-inner{text-align:center;background:rgba(20,30,50,.4);border-color:rgba(77,168,255,.15)}
.slide-title h1{font-size:clamp(32px,5vw,52px);font-weight:800;background:linear-gradient(135deg,#4da8ff,#b0e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;margin-bottom:12px}
.slide-title .sub{font-size:18px;color:rgba(255,255,255,.4)}
.slide-title .lesson-num{font-size:14px;color:rgba(255,255,255,.25);margin-bottom:18px;letter-spacing:3px}
.slide h2{font-size:clamp(22px,3vw,32px);font-weight:700;color:#4da8ff;margin-bottom:18px;border-bottom:1px solid rgba(77,168,255,.15);padding-bottom:10px}
.slide p{font-size:17px;line-height:1.8;margin-bottom:12px;color:rgba(255,255,255,.85)}
.slide ul{margin:8px 0 12px 20px}
.slide li{font-size:16px;line-height:1.7;margin-bottom:5px;color:rgba(255,255,255,.8)}
.slide li strong{color:#b0e0ff}
.slide .highlight-box{background:rgba(77,168,255,.08);border-left:4px solid #4da8ff;padding:16px 20px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.slide .tip-box{background:rgba(255,200,0,.06);border-left:4px solid #ffc800;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;font-size:14px}
.nav-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:10px 20px;z-index:10}
.nav-bar button{background:0 0;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-bar .counter{font-size:14px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav-bar .back-link{color:rgba(255,255,255,.25);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar .back-link:hover{color:#fff;background:rgba(255,255,255,.06)}
@media(max-width:640px){.slide-inner{padding:24px 18px}.nav-bar{padding:8px 12px;gap:8px;bottom:14px}}

        @media (max-width: 640px) {
            .slide-inner { padding: 24px 16px; max-height: 90vh; }
            .slide p { font-size: 15px; }
            .slide li { font-size: 14px; }
            .slide h2 { font-size: 20px; }
            .slide-title h1 { font-size: 28px; }
            .slide-title .sub { font-size: 14px; }
            .flex-row { flex-direction: column; gap: 12px; }
            .flex-row img { max-width: 120px; }
            .nav-controls { padding: 6px 10px; gap: 4px; flex-wrap: wrap; justify-content: center; }
            .nav-controls button { font-size: 20px; padding: 6px 14px; min-width: 44px; min-height: 44px; }
            .nav-controls .page-indicator { font-size: 12px; min-width: 60px; }
            .slide-inner::-webkit-scrollbar { width: 3px; }
        }
    </style></head>

<body>
    <div class="presentation" id="presentation">
        <div class="slide slide-title" id="slideContainer">
            <div class="lesson-num">Web 后端 · 第试</div><h1>数据库基础</h1><div class="sub">存储数据的仓库"</div>
        </div>
    </div>

    <div class="nav-bar"><a class="back-link" href="index.html">ↀ目录</a><button id="prevBtn">◀</button><span class="counter" id="counter">1 / 8</span><button id="nextBtn">▶</button></div>

    <script>
    const slidesData = [
        { html: `<div class="lesson-num">Web 后端 · 第试</div><h1>数据库基础</h1><div class="sub">存储数据的仓库"</div>`, cls: 'slide slide-title active' },
        { html: `<h2>关系型数据库</h2><p>最常见的是<strong>关系型数据库</strong>（像 Excel 表格）：</p><ul><li>数据存成"行（Table！</li><li>表里有行（Row）和"分（Column！</li><li>表之间可以关联（用户行ↀ订单表）</li></ul><p>常见的关系型数据库：<strong>SQLite</strong>（轻量）、strong>MySQL</strong>（流行）、strong>PostgreSQL</strong>（高级）</p>`, cls: 'slide' },
        { html: `<h2>SQL 基本语句</h2><p>SQL（Structured Query Language）是操作数据库的语言！</p><p><strong>查询</strong>！code>SELECT * FROM users WHERE age > 18</code></p><p><strong>插入</strong>！code>INSERT INTO users (name, age) VALUES ('张三', 20)</code></p><p><strong>更新</strong>！code>UPDATE users SET age = 21 WHERE name = '张三'</code></p><p><strong>删除</strong>！code>DELETE FROM users WHERE name = '张三'</code></p>`, cls: 'slide' },
        { html: `<h2>SQLite + Flask</h2><p>SQLite 不需要安装服务器，文件即数据库：</p><p><code>import sqlite3</code></p><p><code>conn = sqlite3.connect("data.db")</code></p><p><code>cursor = conn.cursor()</code></p><p><code>cursor.execute("CREATE TABLE IF NOT EXISTS users (id INTEGER, name TEXT)")</code></p><p>在Flask 里用 SQLite 就能做一个完整的带后端的网站、</p>`, cls: 'slide' },
        { html: `<h2>数据库设计示例</h2><p>一个简单的博客数据库：</p><p><code>users</code> 表：id、username、password</p><p><code>posts</code> 表：id、title、content、user_id、created_at</p><p><code>comments</code> 表：id、content、post_id、user_id、created_at</p><p>user_id 把帖子和用户关联起来——这参strong>外键</strong>、</p>`, cls: 'slide' },
        { html: `<h2>ORM 概念</h2><p>ORM（对象关系映射）让你用Python 对象操作数据库，不用内SQL！</p><p>用SQLAlchemy（Flask 常用）：</p><p><code>class User(db.Model):</code></p><p><code>&nbsp;&nbsp;&nbsp;&nbsp;id = db.Column(db.Integer, primary_key=True)</code></p><p><code>&nbsp;&nbsp;&nbsp;&nbsp;name = db.Column(db.String(100))</code></p><p><code>db.session.add(User(name="张三"))</code></p><p><code>db.session.commit()</code></p>`, cls: 'slide' },
        { html: `<h2>总结</h2><ul><li>数据库持久化存储数据，比文件更快更安入</li><li>关系型数据库 = 表（行列）</li><li>SQL 语句：SELECT / INSERT / UPDATE / DELETE</li><li>SQLite 轻量易用，适合学习和个人项目</li><li>ORM 让你用Python 类操作数据库，不用手内SQL</li></ul>`, cls: 'slide' }
    ];
    let current = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('counter');

    function goTo(n) {
        current = (n + slidesData.length) % slidesData.length;
        container.className = slidesData[current].cls;
        container.innerHTML = slidesData[current].html;
        counter.textContent = (current + 1) + ' / ' + slidesData.length;
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    });
    document.getElementById('presentation').addEventListener('click', (e) => {
        if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return;
        goTo(current + 1);
    });
    </script>
</body>
</html>
