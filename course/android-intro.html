<!DOCTYPE html>
<html><head><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>什么是逆向工程</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0f1e;color:#e0e8f0;height:100vh;overflow:hidden}
.presentation { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px; }
.slide-inner{max-width:840px;width:100%;background:rgba(20,30,50,.6);border:1px solid rgba(77,168,255,.2);border-radius:28px;padding:44px 54px;box-shadow:0 0 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
.slide-title .slide-inner{text-align:center;background:rgba(20,30,50,.4);border-color:rgba(77,168,255,.15)}
.slide-title h1{font-size:clamp(32px,5vw,52px);font-weight:800;background:linear-gradient(135deg,#4da8ff,#b0e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;margin-bottom:12px}
.slide-title .sub{font-size:18px;color:rgba(255,255,255,.4)}
.slide-title .lesson-num{font-size:14px;color:rgba(255,255,255,.25);margin-bottom:18px;letter-spacing:3px}
.slide h2{font-size:clamp(22px,3vw,32px);font-weight:700;color:#4da8ff;margin-bottom:18px;border-bottom:1px solid rgba(77,168,255,.15);padding-bottom:10px}
.slide p{font-size:17px;line-height:1.8;margin-bottom:12px;color:rgba(255,255,255,.85)}
.slide ul,.slide ol{margin:8px 0 12px 20px}
.slide li{font-size:16px;line-height:1.7;margin-bottom:5px;color:rgba(255,255,255,.8)}
.slide li strong{color:#b0e0ff}
.slide .highlight-box{background:rgba(77,168,255,.08);border-left:4px solid #4da8ff;padding:16px 20px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.slide .warn-box{background:rgba(255,80,80,.08);border-left:4px solid #ff5050;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide .tip-box{background:rgba(255,200,0,.06);border-left:4px solid #ffc800;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;font-size:14px}
.slide pre{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 20px;margin:12px 0;overflow-x:auto;font-size:14px;line-height:1.6;color:#b0e0ff}
.nav-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:10px 20px;z-index:10}
.nav-bar button{background:0 0;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-bar .counter{font-size:14px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav-bar .back-link{color:rgba(255,255,255,.25);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar .back-link:hover{color:#fff;background:rgba(255,255,255,.06)}
@media(max-width:640px){.slide-inner{padding:24px 16px;max-height:90vh}.slide p{font-size:15px}.slide li{font-size:14px}.slide h2{font-size:20px}.slide-title h1{font-size:28px}.nav-bar{padding:8px 12px;gap:8px;bottom:14px}.slide-inner::-webkit-scrollbar{width:3px}}
    </style></head>
<body>
    <div class="presentation" id="presentation"><div class="slide slide-title" id="slideContainer"></div></div>
    <div class="nav-bar"><a class="back-link" href="index.html">目录</a><button id="prevBtn">◀</button><span class="counter" id="counter"></span><button id="nextBtn">▶</button></div>
    <script>
    const slidesData = [
        { html: `<div class="lesson-num">安卓逆向 · 第试</div><h1>什么是逆向工程</h1><div class="sub">拆开 App 看里面怎么运作</div>`, cls: 'slide slide-title active' },
        { html: `<h2>逆向能做什么</h2><ul><li><strong>学习优秀 App 的实现</strong> — 看大神怎么写的，偷师学艺</li><li><strong>分析恶意软件</strong> — 看病毒在偷什么数据、连接哪个服务器</li><li><strong>修改 App 功能</strong> — 汉化外区 App、去广告、修改游戏数据</li><li><strong>安全研究</strong> — 找漏洞、做渗透测试、审计隐私合规</li><li><strong>恢复丢失的源码</strong> — 老项目没源码了，反编译 APK 看逻辑</li><li><strong>协议分析</strong> — 抓包 + 逆向 = 搞清楚 App 和服务器怎么通信</li></ul>`, cls: 'slide' },
        { html: `<h2>正向开发 vs 逆向工程</h2><p><strong>正向开发：</strong>写代码 → 编译 → 打包 APK → 安装运行</p><p><strong>逆向工程：</strong>拿到 APK → 反编译 → 看代码 → 修改 → 重打包</p><ul><li>正向是从源码到产物，逆向是从产物还原源码</li><li>逆向看到的代码不完全等于原始源码（编译损失 + 混淆）</li><li>但逻辑是等价的，足够分析和修改</li></ul><div class="highlight-box">类比：正向是写菜谱，逆向是拿到成品菜反推菜谱。</div>`, cls: 'slide' },
        { html: `<h2>安卓 App 的打包格式</h2><p>安卓 App 的安装包是 <strong>.apk</strong>（Android Package Kit），本质是一个 <strong>ZIP 压缩包</strong>：</p><ul><li><code>classes.dex</code> — 编译后的代码（Dalvik 字节码）</li><li><code>AndroidManifest.xml</code> — 配置信息（权限、Activity、Service 声明）</li><li><code>res/</code> — 资源文件（图片、布局 XML、字符串）</li><li><code>lib/</code> — 原生库（C/C++ 编译的 .so 文件，分架构）</li><li><code>assets/</code> — 原始资源（游戏素材、字体等）</li><li><code>META-INF/</code> — 签名信息（证书、摘要）</li></ul><div class="highlight-box">把 <code>app.apk</code> 改成 <code>app.zip</code>，用解压软件直接打开就能看到这些文件。</div>`, cls: 'slide' },
        { html: `<h2>什么是 DEX 文件</h2><p><code>classes.dex</code> 是 APK 的核心——Java/Kotlin 代码编译后的产物：</p><ul><li>Java/Kotlin 源码 → <code>javac</code> 编译 → <code>.class</code> 文件</li><li><code>.class</code> → Android SDK 的 <code>d8</code> 工具 → <code>.dex</code> 文件</li><li>DEX 是 Dalvik/ART 虚拟机执行的字节码格式</li></ul><pre># 一个 APK 可以有多个 DEX（超过 64K 方法限制时）
classes.dex      # 主 DEX
classes2.dex     # 第二个 DEX
classes3.dex     # 第三个 DEX...</pre><div class="tip-box">方法数超过 65536 时会自动拆分多 DEX，这是常态。</div>`, cls: 'slide' },
        { html: `<h2>反编译是什么</h2><p>App 编译后变成 <strong>.dex 字节码</strong>，人看不懂。反编译就是把它转回可读代码：</p><ul><li><strong>jadx</strong> → 把 .dex 转成近似 Java 源码（图形界面，最常用）</li><li><strong>apktool</strong> → 把 .dex 转成 Smali 汇编 + 还原资源文件</li><li><strong>JD-GUI</strong> → 老牌 Java 反编译器，也能看 .class</li></ul><div class="highlight-box"><strong>两条路线：</strong><br>想看逻辑 → jadx（Java 源码，更易读）<br>想改功能 → apktool（Smali，可修改后重打包）</div>`, cls: 'slide' },
        { html: `<h2>Smali 是什么</h2><p>Smali 是安卓虚拟机的<strong>汇编语言</strong>——一种介于 Java 和机器码之间的文本表示：</p><pre># Java 源码
if (score >= 60) {
    showPass();
}

# 对应的 Smali
const/4 v0, 0x3c       # v0 = 60
if-lt p1, v0, :fail    # if (score < 60) goto :fail
invoke-direct {p0}, Lcom/app/MainActivity;->showPass()V
:fail</pre><p>每一行 Smali 对应一条 Dalvik 指令，没有花括号、没有缩进陷阱。</p>`, cls: 'slide' },
        { html: `<h2>逆向需要的基础</h2><ul><li><strong>Java 或 Kotlin</strong> — 安卓开发语言，看不懂代码就没法分析</li><li><strong>Smali 汇编</strong> — 修改功能时必须掌握（后面有专门课程）</li><li><strong>工具使用</strong> — jadx、apktool、adb、Android Studio</li><li><strong>网络协议基础</strong> — HTTP/HTTPS、JSON、抓包分析 API 调用</li><li><strong>Linux 基础</strong> — adb shell 本质是 Linux 终端</li></ul><div class="warn-box"><strong>如果你完全没编程基础，建议先学 Python 或 Java 基础再入门逆向。</strong>本课程默认你有基本的编程概念。</div>`, cls: 'slide' },
        { html: `<h2>逆向的法律边界</h2><ul><li><strong>合法</strong>：分析自己的 App、安全研究、学术学习、恶意软件分析</li><li><strong>灰色地带</strong>：绕过广告（可能违反服务条款）</li><li><strong>违法</strong>：破解付费软件分发、窃取用户数据、制作外挂</li></ul><div class="warn-box"><strong>注意：</strong>逆向工程的法律定义因国家/地区不同。中国《计算机软件保护条例》允许为学习和研究目的进行逆向，但不得侵犯著作权。商业破解分发是违法的。</div>`, cls: 'slide' },
        { html: `<h2>逆向工具全家福</h2><ul><li><strong>jadx</strong> — 反编译看 Java 源码</li><li><strong>apktool</strong> — 反编译/重打包 Smali + 资源</li><li><strong>adb</strong> — Android Debug Bridge，连接手机的瑞士军刀</li><li><strong>Frida</strong> — 动态插桩，运行时 Hook</li><li><strong>Xposed / LSPosed</strong> — 框架级 Hook</li><li><strong>Android Studio</strong> — 官方 IDE，调试用</li><li><strong>Wireshark / mitmproxy</strong> — 抓包分析网络请求</li></ul>`, cls: 'slide' },
        { html: `<h2>学习路线图</h2><ol><li><strong>第1阶段</strong>：本课 + APK 结构 + jadx → 看懂代码</li><li><strong>第2阶段</strong>：Smali 基础 → 能改代码</li><li><strong>第3阶段</strong>：apktool 重打包 → 改完能装回去</li><li><strong>第4阶段</strong>：Frida 动态 Hook → 不用重打包也能改</li><li><strong>第5阶段</strong>：脱壳 + 混淆对抗 → 处理加固 App</li><li><strong>第6阶段</strong>：Native 层分析 → C/C++ 逆向</li></ol><div class="highlight-box">本课程涵盖前5个阶段，Native 层需要额外的 C 语言和 ELF 格式知识。</div>`, cls: 'slide' },
        { html: `<h2>总结</h2><ul><li>逆向工程 = 拆开 App 看它里面怎么运作</li><li>.apk 本质是 ZIP 包，包含 dex 代码和资源</li><li>反编译看源码用 jadx，修改用 apktool</li><li>Smali 是修改功能的核心语言</li><li>需要 Java 基础 + 工具使用能力</li></ul><div class="warn-box"><strong>注意法律边界：</strong>逆向工程仅限学习和安全研究，不要用于破解或侵权。</div>`, cls: 'slide' }
    ];
    let current = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('counter');
    function goTo(n) { current = (n + slidesData.length) % slidesData.length; container.className = slidesData[current].cls; container.innerHTML = slidesData[current].html; counter.textContent = (current + 1) + ' / ' + slidesData.length; }
    goTo(0);
    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); } if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); } });
    document.getElementById('presentation').addEventListener('click', (e) => { if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return; goTo(current + 1); });
    </script>
</body>
</html>
