<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进阶：文件系统原理/title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0a0f1e; color: #e0e8f0; height: 100vh; overflow: hidden; }
        .presentation { width: 100%; height: 100vh; position: relative; }
        .slide { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px; pointer-events: none; }
        .slide.active { display: flex; pointer-events: auto; }
        .slide-inner { max-width: 840px; width: 100%; background: rgba(20, 30, 50, 0.6);  border: 1px solid rgba(77, 168, 255, 0.2); border-radius: 28px; padding: 44px 54px; box-shadow: 0 0 50px rgba(0,0,0,0.4); max-height: 82vh; overflow-y: auto; }
        .slide-title .slide-inner { text-align: center; background: rgba(20, 30, 50, 0.4); border-color: rgba(77, 168, 255, 0.15); }
        .slide-title h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; background: linear-gradient(135deg, #4da8ff, #b0e0ff); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; margin-bottom: 12px; }
        .slide-title .sub { font-size: 18px; color: rgba(255,255,255,0.4); }
        .slide-title .lesson-num { font-size: 14px; color: rgba(255,255,255,0.25); margin-bottom: 18px; letter-spacing: 3px; }
        .slide h2 { font-size: clamp(22px, 3vw, 32px); font-weight: 700; color: #4da8ff; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(77, 168, 255, 0.15); }
        .slide p { font-size: 17px; line-height: 1.8; margin-bottom: 12px; color: rgba(255,255,255,0.85); }
        .slide ul { margin: 8px 0 12px 20px; }
        .slide li { font-size: 16px; line-height: 1.7; margin-bottom: 5px; color: rgba(255,255,255,0.8); }
        .slide li strong { color: #b0e0ff; }
        .slide .highlight-box { background: rgba(77, 168, 255, 0.08); border-left: 4px solid #4da8ff; padding: 16px 20px; border-radius: 0 12px 12px 0; margin: 14px 0; font-size: 15px; }
        .slide .tip-box { background: rgba(255, 200, 0, 0.06); border-left: 4px solid #ffc800; padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 14px 0; font-size: 15px; }
        .slide code { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; font-size: 14px; }
        .nav-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; background: rgba(10, 15, 30, 0.7);  border: 1px solid rgba(255,255,255,0.06); border-radius: 30px; padding: 10px 20px; z-index: 10; }
        .nav-bar button { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 18px; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
        .nav-bar button:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .nav-bar .counter { font-size: 14px; color: rgba(255,255,255,0.35); min-width: 60px; text-align: center; }
        .nav-bar .back-link { color: rgba(255,255,255,0.25); text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
        .nav-bar .back-link:hover { color: #fff; background: rgba(255,255,255,0.06); }
        @media (max-width: 640px) { .slide { padding: 16px; } .slide-inner { padding: 24px 18px; } .nav-bar { padding: 8px 12px; gap: 8px; bottom: 14px; } }
    </style>
</head>

<body>
    <div class="presentation" id="presentation">
        <div class="slide slide-title" id="slideContainer">
            
                <img src="images/folder-icon.png" alt="文件系统" style="width:100px;margin-bottom:16px;opacity:0.8">
                <div class="lesson-num">进阶 · 第二试</div>
                <h1>文件系统原理</h1>
                <div class="sub">文件是怎么存在硬盘上的！</div>
        </div>

    <div class="nav-bar">
        <a class="back-link" href="index.html">ↀ目录</a>
        <button id="prevBtn">◀</button>
        <span class="counter" id="counter">1 / 8</span>
        <button id="nextBtn">▀/button>
    </div>

    <script>
    const slidesData = [
        { html: `
                <img src="images/folder-icon.png" alt="文件系统" style="width:100px;margin-bottom:16px;opacity:0.8">
                <div class="lesson-num">进阶 · 第二试</div>
                <h1>文件系统原理</h1>
                <div class="sub">文件是怎么存在硬盘上的！`, cls: 'slide slide-title active' },
        { html: `
                <h2>文件系统是什么？</h2>
                <p>硬盘是一个巨大的"字节数组"——没有文件系统，你只知道这里有500GB 的0 和1，不知道哪些字节属于哪个文件、/p>
                <p><strong>文件系统</strong>就是给硬盘建"目录索引"的规则。Windows 用<strong>NTFS</strong>、/p>
                <ul>
                    <li>FAT32 —旧版，U 盘常见，单文件不能超进4GB</li>
                    <li><strong>NTFS</strong> —Windows 主力，支持大文件、权限、加密/li>
                    <li>exFAT —适合大容释U 盘，兼容性好</li>
                </ul>
            `, cls: 'slide' },
        { html: `
                <h2>NTFS 的核心：MFT</h2>
                <p><strong>MFT</strong>（主文件表）是NTFS 的总账有。硬盘上的每一个文件（包括文件夹自己）都在 MFT 里有一条记录、/p>
                <p>MFT 记录包含：文件名、大小、创建时间、修改时间、数据存在哪、/p>
                <div class="highlight-box">小文件的数据可能直接存在 MFT 记录里（resident），不用额外占空间。大文件的数据才分散存在硬盘上、`, cls: 'slide' },
        { html: `
                <h2>文件不连续存支/h2>
                <p>一个文件不是一整块存在硬盘上的。NTFS 把硬盘分戏strong>簀/strong>（Cluster，默设4KB），文件占用的簇可能不连续、/p>
                <ul>
                    <li>文件写进去时，系统找空闲的簇来存</li>
                    <li>删了文件再写新的 ↀ新文件可能插空"存在不同位置</li>
                    <li>这叫<strong>碎片包/strong>（Fragmentation！/li>
                </ul>
                <div class="tip-box">机械硬盘碎片多了会变慢。固态硬盘（SSD）不受影响，也不要碎片整理、`, cls: 'slide' },
        { html: `
                <h2>删除文件到底删了什么？</h2>
                <p>很多人以为删除文件就是把数据"擦掉"了。其实不是：</p>
                <ul>
                    <li>删除 ↀ系统只是在MFT 记录上做一已删际的标设/li>
                    <li>数据本身还完好无损地躺在硬盘一/li>
                    <li>清空回收站ↀ标记一可用空间"，但数据还在</li>
                    <li>直到新文件写进来覆盖了这些位置，数据才真正消备/li>
                </ul>
                <div class="highlight-box">这就是为什么删除的文件能恢复——只要还没被覆盖。所以想彻底删除，要用专门的工具"覆写"、`, cls: 'slide' },
        { html: `
                <h2>路径的解析过程/h2>
                <p><code>C:\\Users\\Alice\\doc.txt</code> 不是简单的"字符串查所，而是一层层 MFT 引用！/p>
                <ul>
                    <li>从根目录 <code>$Root</code> 的MFT 记录开姀/li>
                    <li>找到"Users"文件夹的 MFT 记录</li>
                    <li>在Users 里找分Alice"的MFT 记录</li>
                    <li>在Alice 里找分doc.txt 的MFT 记录</li>
                    <li>代MFT 记录里读取文件数据的位置</li>
                </ul>
            `, cls: 'slide' },
        { html: `
                <h2>NTFS 权限（ACL！/h2>
                <p>NTFS 里的每个文件/文件夹都有一一strong>安全描述第/strong>，里面包含一开strong>ACL</strong>（访问控制列表）表：</p>
                <ul>
                    <li>每条 ACE 规定了某个用戏组可以做什之/li>
                    <li>读取、写入、修改、完全控分/li>
                    <li>权限会从父文件夹<strong>继承</strong>给子文件</li>
                </ul>
                <div class="tip-box">右键文件 ↀ属态ↀ安全，就能看到这个文件的 ACL、`, cls: 'slide' },
        { html: `
                <h2>总结</h2>
                <ul>
                    <li>文件系统是硬盘的索引系统，NTFS 是Windows 的标出/li>
                    <li>MFT 是NTFS 的总账有，每个文件一条记录/li>
                    <li>文件数据不连续存放，可能碎片包/li>
                    <li>删除只是标记，数据还在——覆盖后才真消失</li>
                    <li>路径是一层层 MFT 引用链/li>
                    <li>NTFS 权限基于 ACL，可以精细控分/li>
                </ul>
            `, cls: 'slide' }
    ];
    let current = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('counter');

    function goTo(n) {
        current = (n + slidesData.length) % slidesData.length;
        container.className = slidesData[current].cls;
        container.innerHTML = slidesData[current].html;
        counter.textContent = (current + 1) + ' / ' + slidesData.length;
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    });
    document.getElementById('presentation').addEventListener('click', (e) => {
        if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return;
        goTo(current + 1);
    });
    </script>
</body>

</html>
