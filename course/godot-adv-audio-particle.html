<!DOCTYPE html>
<html><head><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Godot 音效与特数/title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0f1e;color:#e0e8f0;height:100vh;overflow:hidden}
.presentation{width:100%;height:100vh;position:relative}
.slide{position:absolute;inset:0;display: none;flex-direction:column;align-items:center;justify-content:center;padding:60px;pointer-events:none;transition:opacity .4s ease}
.slide.active{opacity:1;pointer-events:auto}
.slide-inner{max-width:840px;width:100%;background:rgba(20,30,50,.6);border:1px solid rgba(255,180,50,.2);border-radius:28px;padding:44px 54px;box-shadow:0 0 50px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}
.slide-title .slide-inner{text-align:center;background:rgba(20,30,50,.4);border-color:rgba(255,180,50,.15)}
.slide-title h1{font-size:clamp(32px,5vw,52px);font-weight:800;background:linear-gradient(135deg,#ffb432,#ffd580);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;margin-bottom:12px}
.slide-title .sub{font-size:18px;color:rgba(255,255,255,.4)}
.slide-title .lesson-num{font-size:14px;color:rgba(255,255,255,.25);margin-bottom:18px;letter-spacing:3px}
.slide h2{font-size:clamp(22px,3vw,32px);font-weight:700;color:#ffb432;margin-bottom:18px;border-bottom:1px solid rgba(255,180,50,.15);padding-bottom:10px}
.slide p{font-size:17px;line-height:1.8;margin-bottom:12px;color:rgba(255,255,255,.85)}
.slide ul{margin:8px 0 12px 20px}
.slide li{font-size:16px;line-height:1.7;margin-bottom:5px;color:rgba(255,255,255,.8)}
.slide li strong{color:#ffd580}
.slide .highlight-box{background:rgba(255,180,50,.08);border-left:4px solid #ffb432;padding:16px 20px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.slide .tip-box{background:rgba(255,200,0,.06);border-left:4px solid #ffc800;padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.slide code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;font-size:14px}
.nav-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:10px 20px;z-index:10}
.nav-bar button{background:0 0;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-bar .counter{font-size:14px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav-bar .back-link{color:rgba(255,255,255,.25);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav-bar .back-link:hover{color:#fff;background:rgba(255,255,255,.06)}
@media(max-width:640px){.slide{padding:16px}.slide-inner{padding:24px 18px}.nav-bar{padding:8px 12px;gap:8px;bottom:14px}}

        @media (max-width: 640px) {
            .slide { padding: 10px; }
            .slide-inner { padding: 24px 16px; max-height: 90vh; }
            .slide p { font-size: 15px; }
            .slide li { font-size: 14px; }
            .slide h2 { font-size: 20px; }
            .slide-title h1 { font-size: 28px; }
            .slide-title .sub { font-size: 14px; }
            .flex-row { flex-direction: column; gap: 12px; }
            .flex-row img { max-width: 120px; }
            .nav-controls { padding: 6px 10px; gap: 4px; flex-wrap: wrap; justify-content: center; }
            .nav-controls button { font-size: 20px; padding: 6px 14px; min-width: 44px; min-height: 44px; }
            .nav-controls .page-indicator { font-size: 12px; min-width: 60px; }
            .slide-inner::-webkit-scrollbar { width: 3px; }
        }
    </style></head>
<body><div class="presentation" id="presentation">
<div class="slide slide-title active" data-index="0"><div class="slide-inner"><div class="lesson-num">Godot · 进阶第试/div><h1>音效与特数/h1><div class="sub">让游戏更好听更好看/div></div></div>
<div class="slide" data-index="1"><div class="slide-inner"><h2>AudioStreamPlayer</h2><p>播放音效的最基本节点、br>拖入一一.mp3 戏.ogg 文件分Stream 属性、/p><p>代码控制！/p><p><code>$AudioStreamPlayer.play()</code> ↀ播放</p><p><code>$AudioStreamPlayer.stop()</code> ↀ停止</p><p><code>$AudioStreamPlayer.pitch_scale = 1.5</code> ↀ变速变谀/p><p><code>$AudioStreamPlayer.volume_db = -10</code> ↀ音量（分贝）</p></div></div>
<div class="slide" data-index="2"><div class="slide-inner"><h2>音频文件格式</h2><ul><li><strong>.mp3</strong> —压缩率高，适合音乐</li><li><strong>.ogg</strong> —开源格式，Godot 原生支持</li><li><strong>.wav</strong> —无损，适合短音数/li></ul><div class="tip-box">短音效（开枪、跳跃）用.wav，长背景音乐用.ogg、/div></div></div>
<div class="slide" data-index="3"><div class="slide-inner"><h2>AudioStreamPlayer2D</h2><p>2D 空间音效——声源在游戏世界里，有立体感！/p><ul><li><strong>距离越远声音越小</strong></li><li><strong>在左边播支ↀ左声道响</strong></li><li>设置 <strong>Max Distance</strong> 控制可听范围</li></ul><p>适合脚步声、枪声、环境音效、/p></div></div>
<div class="slide" data-index="4"><div class="slide-inner"><h2>粒子系统 GPUParticles2D</h2><p>粒子效果：火焰、烟雾、爆炸、星光、/p><ul><li>创建 <strong>GPUParticles2D</strong> 节点</li><li><strong>Amount</strong> —粒子数量</li><li><strong>Lifetime</strong> —每个粒子存在秒数</li><li><strong>速度 / 方向 / 旋转</strong> —粒子运动参数</li><li><strong>Material ↀParticleProcessMaterial</strong> —颜色渐变</li></ul></div></div>
<div class="slide" data-index="5"><div class="slide-inner"><h2>粒子发射控制</h2><p><code>$GPUParticles2D.emitting = true</code> ↀ开始发就/p><p><code>$GPUParticles2D.emitting = false</code> ↀ停止发射</p><p><code>$GPUParticles2D.one_shot = true</code> ↀ只喷一次（爆炸效果！/p><p>爆炸效果：one_shot = true ↀ调用 emitting = true ↀ等粒子全部消失后自动停止、/p></div></div>
<div class="slide" data-index="6"><div class="slide-inner"><h2>Tween 过渡动画</h2><p>Tween 让属性平滑变化：</p><p><code>var tween = create_tween()</code></p><p><code>tween.tween_property($Sprite, "modulate:a", 0, 0.5)</code> ↀ渐隐</p><p><code>tween.tween_property($Sprite, "scale", Vector2(2,2), 1.0)</code> ↀ放大</p><p><code>tween.tween_property($Node2D, "position", Vector2(100,0), 0.3)</code> ↀ滑动</p></div></div>
<div class="slide" data-index="7"><div class="slide-inner"><h2>总结</h2><ul><li>AudioStreamPlayer 播放音效，play()/stop()/pitch_scale</li><li>AudioStreamPlayer2D 实现空间音效（左/参进近）</li><li>GPUParticles2D 做火焦爆炸等粒子效析/li><li>Tween 创建平滑过渡动画（移力缩放/渐隐！/li></ul></div></div>
</div>
<div class="nav-bar"><a class="back-link" href="index.html">ↀ目录</a><button id="prevBtn">◀</button><span class="counter" id="counter">1 / 8</span><button id="nextBtn">▀/button></div>
<script>
const slides=document.querySelectorAll('.slide'),total=slides.length;let current=0;
function goTo(n) { slides.forEach(s => s.style.display = 'none'); slides[current].classList.remove('active'); current = (n + total) % total; slides[current].style.display = 'flex'; slides[current].classList.add('active'); document.getElementById('counter').textContent = (current + 1) + ' / ' + total; }
document.getElementById('prevBtn').addEventListener('click',()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click',()=>goTo(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();goTo(current+1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(current-1)}});
document.getElementById('presentation').addEventListener('click',e=>{if(e.target.closest('.nav-bar')||e.target.closest('.slide-inner'))return;goTo(current+1)});
</script></body></html>
