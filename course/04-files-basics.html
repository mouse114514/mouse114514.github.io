<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第课：文件与文件夹的那些事儀/title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0a0f1e; color: #e0e8f0; height: 100vh; overflow: hidden; }
        .presentation { width: 100%; height: 100vh; position: relative; }
        .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .slide.active { opacity: 1; pointer-events: auto; }
        .slide-inner { max-width: 840px; width: 100%; background: rgba(20, 30, 50, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(77, 168, 255, 0.2); border-radius: 28px; padding: 44px 54px; box-shadow: 0 0 50px rgba(0,0,0,0.4); max-height: 82vh; overflow-y: auto; }
        .flex-row { display: flex; gap: 30px; align-items: center; }
        .flex-row .text { flex: 1; }
        .slide-title .slide-inner { text-align: center; background: rgba(20, 30, 50, 0.4); border-color: rgba(77, 168, 255, 0.15); }
        .slide-title h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; background: linear-gradient(135deg, #4da8ff, #b0e0ff); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; margin-bottom: 12px; }
        .slide-title .sub { font-size: 18px; color: rgba(255,255,255,0.4); }
        .slide-title .lesson-num { font-size: 14px; color: rgba(255,255,255,0.25); margin-bottom: 18px; letter-spacing: 3px; }
        .slide h2 { font-size: clamp(22px, 3vw, 32px); font-weight: 700; color: #4da8ff; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(77, 168, 255, 0.15); }
        .slide p { font-size: 17px; line-height: 1.8; margin-bottom: 12px; color: rgba(255,255,255,0.85); }
        .slide ul { margin: 8px 0 12px 20px; }
        .slide li { font-size: 16px; line-height: 1.7; margin-bottom: 5px; color: rgba(255,255,255,0.8); }
        .slide li strong { color: #b0e0ff; }
        .slide .tip-box { background: rgba(255, 200, 0, 0.06); border-left: 4px solid #ffc800; padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 14px 0; font-size: 15px; }
        .slide .highlight-box { background: rgba(77, 168, 255, 0.08); border-left: 4px solid #4da8ff; padding: 16px 20px; border-radius: 0 12px 12px 0; margin: 14px 0; font-size: 15px; }
        .slide code { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; font-size: 14px; }
        .nav-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; background: rgba(10, 15, 30, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 30px; padding: 10px 20px; z-index: 10; }
        .nav-bar button { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 18px; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
        .nav-bar button:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .nav-bar .counter { font-size: 14px; color: rgba(255,255,255,0.35); min-width: 60px; text-align: center; }
        .nav-bar .back-link { color: rgba(255,255,255,0.25); text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
        .nav-bar .back-link:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .key { display: inline-block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; padding: 2px 10px; font-size: 14px; color: #b0e0ff; font-family: monospace; margin: 2px 0; }
        @media (max-width: 640px) { .slide { padding: 16px; } .slide-inner { padding: 24px 18px; } .nav-bar { padding: 8px 12px; gap: 8px; bottom: 14px; } .flex-row { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="presentation" id="presentation">
        <div class="slide slide-title active" data-index="0">
            <div class="slide-inner">
                <img src="images/folder-icon.png" alt="文件" style="width:100px;margin-bottom:16px;opacity:0.8">
                <div class="lesson-num">第四试/div>
                <h1>文件与文件夹的那些事儀/h1>
                <div class="sub">整理文件、找回误删、看懂后缀</div>
            </div>
        </div>

        <div class="slide" data-index="1">
            <div class="slide-inner">
                <h2>文件 vs 文件备/h2>
                <p><strong>文件</strong> = 一一东西"：一张照片、一首歌、一篇文站/p>
                <p><strong>文件备/strong> = 装文件的"袋子"：把相关的文件放一走/p>
                <p>一个文件夹可以放进另一个文件夹里——像套娃一样。这就是<strong>树状结构</strong>、/p>
                <div class="highlight-box">
                    📁 不把文件乱丢在桌面，持学习"、工作"、照片"分类建文件夹，电脑才不会乱、                </div>
            </div>
        </div>

        <div class="slide" data-index="2">
            <div class="slide-inner">
                <h2>文件的身份试：扩展名</h2>
                <p>每个文件名后面有 <code>.</code> + 字母，这参strong>扩展名/strong>，告诉系统这个文件是什么类型：</p>
                <ul>
                    <li><code>.txt</code> —文本文件（记事本打开！/li>
                    <li><code>.jpg</code> / <code>.png</code> —图片</li>
                    <li><code>.mp3</code> —音乐</li>
                    <li><code>.mp4</code> —视频</li>
                    <li><code>.docx</code> / <code>.xlsx</code> —Office 文档</li>
                    <li><code>.exe</code> —可执行程序（安装软件就是这个！/li>
                    <li><code>.pdf</code> —电子文档（跨平台通用！/li>
                </ul>
            </div>
        </div>

        <div class="slide" data-index="3">
            <div class="slide-inner">
                <h2>怎么打开一个文件？</h2>
                <p>Windows 根据扩展名判断用什么程序打开！/p>
                <ul>
                    <li>双击 <code>.txt</code> ↀ用记事本打开</li>
                    <li>双击 <code>.jpg</code> ↀ用照片查看器打开</li>
                    <li>双击 <code>.mp3</code> ↀ用播放器打开</li>
                </ul>
                <p>如果惀strong>换一个程序/strong>打开：右键文代ↀ<strong>打开方式</strong> ↀ选择其他应用</p>
                <div class="tip-box">
                    💡 比如：一一.txt 文件也可以用 Word 打开。右键ↀ打开方式 ↀ选择 Word、                </div>
            </div>
        </div>

        <div class="slide" data-index="4">
            <div class="slide-inner">
                <h2>文件的操作：复制、移动、删际/h2>
                <p>选中文件后：</p>
                <ul>
                    <li><strong>复制</strong> <span class="key">Ctrl</span> + <span class="key">C</span> —原地留一份，另一份贴到别备/li>
                    <li><strong>剪切</strong> <span class="key">Ctrl</span> + <span class="key">X</span> —原位置消失，移到别处</li>
                    <li><strong>粘贴</strong> <span class="key">Ctrl</span> + <span class="key">V</span> —把复分剪切的内容放到当前文件夹</li>
                    <li><strong>删除</strong> <span class="key">Delete</span> —文件进回收站</li>
                    <li><strong>彻底删除</strong> <span class="key">Shift</span> + <span class="key">Delete</span> —不经过回收站</li>
                </ul>
                <div class="tip-box">
                    💡 也可以拖拽移动文件：按住左键拖到另一个文件夹。按但<span class="key">Ctrl</span> 再拖 = 复制、                </div>
            </div>
        </div>

        <div class="slide" data-index="5">
            <div class="slide-inner">
                <h2>回收站的秘密</h2>
                <p>删除文件 ↀ进回收站 ↀ以为删掉了？其实没有！/p>
                <ul>
                    <li>文件只是被strong>标记一已删际</strong>，实际数据还在硬盘上</li>
                    <li>回收站里可以看到所有删除的文件！strong>右键 ↀ还原</strong>就能找回</li>
                    <li>只有但strong>清空回收站/strong>，系统才会把空间标记一可用"</li>
                </ul>
                <div class="highlight-box">
                    💡 即使清空了回收站，用数据恢复软件也能找回（只要没被新数据覆盖）。所以别以为删了就没了！
                </div>
            </div>
        </div>

        <div class="slide" data-index="6">
            <div class="slide-inner">
                <h2>文件找不到了？用搜索</h2>
                <p>文件太多找不到？不用一个一个翻！/p>
                <ul>
                    <li>持<span class="key">Win</span> + <span class="key">S</span> ↀ输入文件名的一部分 ↀ系统自动搜索</li>
                    <li>在文件资源管理器右上角也有搜索框，可以搜当前文件备/li>
                    <li>搜索支持通配符：<code>*.jpg</code> 表示所有jpg 图片</li>
                </ul>
                <div class="tip-box">
                    💡 给文件起个好名字，搜索才找得到、2025年工作报命毀新建文档(5)"好搜一百倍、                </div>
            </div>
        </div>

        <div class="slide" data-index="7">
            <div class="slide-inner">
                <h2>总结</h2>
                <ul>
                    <li>文件有扩展名，告诉系统怎么打开安/li>
                    <li>复制 = 留原样再复制一份，剪切 = 原位置消备/li>
                    <li>删除进回收站，不是真删了（清空才是）</li>
                    <li>用<span class="key">Win</span> + <span class="key">S</span> 搜索文件，又快又出/li>
                    <li>文件分类整理，不乱丢桌面</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a class="back-link" href="index.html">ↀ目录</a>
        <button id="prevBtn">◀</button>
        <span class="counter" id="counter">1 / 8</span>
        <button id="nextBtn">▀/button>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide'); const total = slides.length; let current = 0;
        function goTo(n) { slides.forEach(s => s.classList.remove('active')); current = (n + total) % total; slides[current].classList.add('active'); document.getElementById('counter').textContent = (current + 1) + ' / ' + total; }
        document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
        document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); } if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); } });
        document.getElementById('presentation').addEventListener('click', (e) => { if (e.target.closest('.nav-bar') || e.target.closest('.slide-inner')) return; goTo(current + 1); });
    </script>
</body>
</html>
