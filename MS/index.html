<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源库 · X Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: #080c18;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px 40px;
            pointer-events: none;
        }
        .page-header h1 {
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 900;
            background: linear-gradient(135deg, #4da8ff, #b0e0ff, #7c5cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 60px rgba(77,168,255,0.3);
        }
        .page-header p {
            margin-top: 12px;
            font-size: 18px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            font-weight: 300;
        }
        .page-header .stats {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 32px;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }
        .page-header .stats span { display: flex; align-items: center; gap: 6px; }

        .controls {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 0 20px 32px;
            flex-wrap: wrap;
            pointer-events: none;
        }
        .controls > * { pointer-events: auto; }

        .search-box {
            position: relative;
            width: 320px;
            max-width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 44px;
            border-radius: 30px;
            border: 1px solid rgba(77,168,255,0.3);
            background: rgba(20,30,50,0.6);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.3); }
        .search-box input:focus {
            border-color: #4da8ff;
            box-shadow: 0 0 25px rgba(77,168,255,0.2);
        }
        .search-box .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 16px;
        }

        .sort-group {
            display: flex;
            gap: 8px;
        }
        .sort-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(77,168,255,0.2);
            background: rgba(20,30,50,0.5);
            backdrop-filter: blur(8px);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .sort-btn:hover {
            border-color: rgba(77,168,255,0.5);
            color: #fff;
            background: rgba(77,168,255,0.1);
        }
        .sort-btn.active {
            border-color: #4da8ff;
            color: #4da8ff;
            background: rgba(77,168,255,0.15);
            box-shadow: 0 0 20px rgba(77,168,255,0.15);
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: rgba(20,30,50,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(77,168,255,0.2);
            border-radius: 30px;
            padding: 4px;
        }
        .view-toggle button {
            width: 36px; height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .view-toggle button.active {
            background: rgba(77,168,255,0.2);
            color: #4da8ff;
        }
        .view-toggle button:hover { color: #fff; }

        .gallery-wrap {
            position: relative;
            z-index: 1;
            padding: 0 24px 80px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .gallery {
            display: grid;
            gap: 20px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gallery.grid-4 { grid-template-columns: repeat(4, 1fr); }
        .gallery.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .gallery.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .gallery.grid-1 { grid-template-columns: repeat(1, 1fr); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
            color: rgba(255,255,255,0.3);
            font-size: 18px;
        }

        .card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(20,30,50,0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(77,168,255,0.15);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s ease,
                        border-color 0.4s ease;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            will-change: transform;
            aspect-ratio: 4 / 3;
        }
        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card:hover {
            border-color: rgba(77,168,255,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(77,168,255,0.1);
            z-index: 5;
        }
        .card.tilt-active {
            transition: transform 0.1s ease-out, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .card-link {
            display: block;
            width: 100%; height: 100%;
            text-decoration: none;
            color: inherit;
        }

        .card-thumb {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .card-thumb img,
        .card-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover .card-thumb img,
        .card:hover .card-thumb video {
            transform: scale(1.08);
        }
        .card-thumb .file-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            opacity: 0.6;
            color: #4da8ff;
            text-shadow: 0 0 30px rgba(77,168,255,0.4);
        }
        .card-thumb .file-type-badge {
            position: absolute;
            top: 12px; right: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #4da8ff;
            border: 1px solid rgba(77,168,255,0.3);
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 16px 14px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        .card:hover .card-info {
            transform: translateY(0);
        }
        .card-info .name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 8px rgba(0,0,0,0.8);
        }
        .card-info .meta {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }

        .card-info .meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .lightbox.active {
            display: flex;
            pointer-events: auto;
        }
        .lightbox-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .lightbox.active .lightbox-bg { opacity: 1; }
        .lightbox-content {
            position: relative;
            z-index: 2;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.4s ease;
        }
        .lightbox.active .lightbox-content {
            transform: scale(1);
            opacity: 1;
        }
        .lightbox-content img,
        .lightbox-content video {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
        }
        .lightbox-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 24px 30px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: #fff;
            z-index: 3;
            pointer-events: none;
        }
        .lightbox-info .meta span,
        .lightbox-info .name {
            pointer-events: auto;
        }
        .lightbox-info .name {
            font-size: 20px;
            font-weight: 600;
        }
        .lightbox-info .meta {
            display: flex;
            gap: 20px;
            margin-top: 6px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 20px;
            z-index: 3;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            line-height: 1;
        }
        .lightbox-close:hover {
            background: rgba(255,77,77,0.3);
            border-color: rgba(255,77,77,0.5);
            transform: scale(1.1);
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            opacity: 0;
        }
        .lightbox:hover .lightbox-nav { opacity: 1; }
        .lightbox-nav:hover {
            background: rgba(77,168,255,0.2);
            border-color: rgba(77,168,255,0.5);
        }
        .lightbox-nav.prev { left: 24px; }
        .lightbox-nav.next { right: 24px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(77,168,255,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(77,168,255,0.5); }

        /* Loading shimmer */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .card.loading .card-thumb {
            background: linear-gradient(90deg, rgba(77,168,255,0.05) 25%, rgba(77,168,255,0.12) 50%, rgba(77,168,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @media (max-width: 1200px) {
            .gallery.grid-4 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .gallery.grid-4, .gallery.grid-3 { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .sort-group { justify-content: center; }
            .lightbox-nav { opacity: 1; width: 40px; height: 40px; }
            .lightbox-nav.prev { left: 12px; }
            .lightbox-nav.next { right: 12px; }
        }
        @media (max-width: 500px) {
            .gallery.grid-4, .gallery.grid-3, .gallery.grid-2 { grid-template-columns: 1fr; }
            .page-header { padding: 30px 16px 20px; }
            .gallery-wrap { padding: 0 12px 40px; }
            .card { aspect-ratio: auto; height: 240px; }
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<header class="page-header">
    <h1>✦ 资源库</h1>
    <p>Resource Gallery</p>
    <div class="stats">
        <span id="fileCount">📦 0 个文件</span>
        <span id="imageCount">🖼 0 张图片</span>
        <span id="totalSize">💾 0 KB</span>
    </div>
</header>

<div class="controls">
    <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索文件..." autocomplete="off">
    </div>
    <div class="sort-group">
        <button class="sort-btn active" data-sort="name">名称</button>
        <button class="sort-btn" data-sort="time">时间</button>
        <button class="sort-btn" data-sort="size">大小</button>
        <button class="sort-btn" data-sort="type">类型</button>
    </div>
    <div class="view-toggle">
        <button data-cols="4" class="active" title="网格">⊞</button>
        <button data-cols="2" title="大图">⊟</button>
        <button data-cols="1" title="列表">☰</button>
    </div>
</div>

<div class="gallery-wrap">
    <div class="gallery grid-4" id="gallery"></div>
</div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-bg"></div>
    <button class="lightbox-close" id="lbClose">✕</button>
    <button class="lightbox-nav prev" id="lbPrev">‹</button>
    <button class="lightbox-nav next" id="lbNext">›</button>
    <div class="lightbox-content" id="lbContent"></div>
    <div class="lightbox-info" id="lbInfo">
        <div class="name" id="lbName"></div>
        <div class="meta" id="lbMeta"></div>
    </div>
</div>

<script src="./files.js"></script>
<script>
(function() {
    let FILES = [];

    // ── Resolve relative path ──
    const RES_DIR = '../res/';

    // ── DOM refs ──
    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('searchInput');
    const sortBtns = document.querySelectorAll('.sort-btn');
    const viewBtns = document.querySelectorAll('.view-toggle button');
    const lightbox = document.getElementById('lightbox');
    const lbContent = document.getElementById('lbContent');
    const lbName = document.getElementById('lbName');
    const lbMeta = document.getElementById('lbMeta');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const fileCount = document.getElementById('fileCount');
    const imageCount = document.getElementById('imageCount');
    const totalSize = document.getElementById('totalSize');

    let currentSort = 'name';
    let currentView = 4;
    let searchQuery = '';
    let currentIndex = -1;
    let filteredFiles = [];

    // ── Helpers ──
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatTime(iso) {
        const d = new Date(iso);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getExt(name) {
        const i = name.lastIndexOf('.');
        return i > 0 ? name.slice(i+1).toLowerCase() : '';
    }

    function isImage(ext) {
        return ['jpg','jpeg','png','gif','webp','bmp','svg','ico'].includes(ext);
    }
    function isVideo(ext) {
        return ['mp4','webm','mov','avi','mkv'].includes(ext);
    }

    function getFileIcon(ext) {
        if (isImage(ext)) return '🖼';
        if (isVideo(ext)) return '🎬';
        if (['mp3','wav','flac','ogg'].includes(ext)) return '🎵';
        if (['pdf'].includes(ext)) return '📄';
        if (['zip','rar','7z','gz'].includes(ext)) return '📦';
        if (['json','xml','yaml'].includes(ext)) return '📋';
        return '📁';
    }

    // ── Particle system ──
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.25;
            this.vy = (Math.random() - 0.5) * 0.25;
            this.size = Math.random() * 2 + 1;
            this.alpha = Math.random() * 0.5 + 0.1;
            this.pulse = Math.random() * Math.PI * 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.pulse += 0.02;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            const a = this.alpha * (0.6 + 0.4 * Math.sin(this.pulse));
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(77, 168, 255, ${a})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.min(120, Math.floor(canvas.width * canvas.height / 12000));
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function drawConnections() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(77, 168, 255, ${0.08 * (1 - dist / 150)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawConnections();
        animId = requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ── Render gallery ──
    function getSortedFiltered() {
        let list = [...FILES];
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            list = list.filter(f => f.name.toLowerCase().includes(q));
        }
        list.sort((a, b) => {
            switch (currentSort) {
                case 'name': return a.name.localeCompare(b.name);
                case 'time': return new Date(b.time) - new Date(a.time);
                case 'size': return b.size - a.size;
                case 'type': return getExt(a.name).localeCompare(getExt(b.name));
                default: return 0;
            }
        });
        return list;
    }

    function render() {
        const list = getSortedFiltered();
        filteredFiles = list;

        // Update stats
        fileCount.textContent = '📦 ' + list.length + ' 个文件';
        let imgCount = 0, totalBytes = 0;
        FILES.forEach(f => { totalBytes += f.size; if (isImage(getExt(f.name))) imgCount++; });
        imageCount.textContent = '🖼 ' + imgCount + ' 张图片';
        totalSize.textContent = '💾 ' + formatSize(totalBytes);

        if (list.length === 0) {
            gallery.innerHTML = '<div class="empty-state">没有匹配的文件</div>';
            return;
        }

        gallery.innerHTML = '';
        list.forEach((f, idx) => {
            const ext = getExt(f.name);
            const img = isImage(ext);
            const vid = isVideo(ext);

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = idx;

            const thumb = document.createElement('div');
            thumb.className = 'card-thumb';

            if (img) {
                const imgEl = document.createElement('img');
                imgEl.loading = 'lazy';
                imgEl.src = RES_DIR + f.name;
                imgEl.alt = f.name;
                imgEl.onerror = function() {
                    this.style.display = 'none';
                    const icon = document.createElement('div');
                    icon.className = 'file-icon';
                    icon.textContent = '🖼';
                    thumb.appendChild(icon);
                };
                thumb.appendChild(imgEl);
            } else if (vid) {
                const vidEl = document.createElement('video');
                vidEl.preload = 'metadata';
                vidEl.muted = true;
                vidEl.loop = true;
                const src = document.createElement('source');
                src.src = RES_DIR + f.name;
                vidEl.appendChild(src);
                thumb.appendChild(vidEl);
                // Play on hover
                card.addEventListener('mouseenter', () => vidEl.play().catch(() => {}));
                card.addEventListener('mouseleave', () => { vidEl.pause(); vidEl.currentTime = 0; });
            } else {
                const icon = document.createElement('div');
                icon.className = 'file-icon';
                icon.textContent = getFileIcon(ext);
                thumb.appendChild(icon);
            }

            const badge = document.createElement('div');
            badge.className = 'file-type-badge';
            badge.textContent = ext.toUpperCase() || '?';
            thumb.appendChild(badge);

            const info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = `
                <div class="name">${f.name}</div>
                <div class="meta">
                    <span>${formatSize(f.size)}</span>
                    <span>${formatTime(f.time)}</span>
                </div>
            `;

            const link = document.createElement('a');
            link.className = 'card-link';
            link.href = RES_DIR + f.name;
            link.target = '_blank';
            link.appendChild(thumb);
            link.appendChild(info);

            card.appendChild(link);

            // Click to open lightbox (only images/videos)
            if (img || vid) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    openLightbox(idx);
                });
            }

            gallery.appendChild(card);
        });

        // Observe entrance animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '50px' });
        document.querySelectorAll('.card').forEach((el, i) => {
            setTimeout(() => observer.observe(el), i * 30);
        });
    }

    // ── 3D tilt on cards ──
    let tiltEnabled = true;
    document.addEventListener('mousemove', (e) => {
        if (!tiltEnabled) return;
        const cards = document.querySelectorAll('.card.tilt-active');
        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = (e.clientX - centerX) / (rect.width / 2);
            const deltaY = (e.clientY - centerY) / (rect.height / 2);
            const rotateY = deltaX * 8;
            const rotateX = -deltaY * 8;
            card.style.transform = card.classList.contains('visible')
                ? `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02,1.02,1.02)`
                : '';
        });
    });

    document.addEventListener('mouseleave', () => {
        document.querySelectorAll('.card.tilt-active').forEach(card => {
            card.style.transform = '';
        });
    });

    // Enable tilt after entrance
    document.addEventListener('transitionend', (e) => {
        if (e.target.classList.contains('card') && e.propertyName === 'opacity') {
            e.target.classList.add('tilt-active');
        }
    });

    // ── Lightbox ──
    function openLightbox(idx) {
        currentIndex = idx;
        const f = filteredFiles[idx];
        if (!f) return;
        const ext = getExt(f.name);
        const img = isImage(ext);
        const vid = isVideo(ext);

        lbContent.innerHTML = '';
        if (img) {
            const imgEl = document.createElement('img');
            imgEl.src = RES_DIR + f.name;
            imgEl.alt = f.name;
            lbContent.appendChild(imgEl);
        } else if (vid) {
            const vidEl = document.createElement('video');
            vidEl.controls = true;
            vidEl.autoplay = true;
            const src = document.createElement('source');
            src.src = RES_DIR + f.name;
            vidEl.appendChild(src);
            lbContent.appendChild(vidEl);
        }

        lbName.textContent = f.name;
        lbMeta.innerHTML = `<span>${formatSize(f.size)}</span><span>${formatTime(f.time)}</span><span>${ext.toUpperCase()}</span>`;

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        const media = lbContent.querySelector('video');
        if (media) media.pause();
    }

    function navLightbox(dir) {
        if (filteredFiles.length === 0) return;
        let newIdx = currentIndex + dir;
        if (newIdx < 0) newIdx = filteredFiles.length - 1;
        if (newIdx >= filteredFiles.length) newIdx = 0;
        openLightbox(newIdx);
    }

    // ── Events ──
    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => navLightbox(-1));
    lbNext.addEventListener('click', () => navLightbox(1));

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-bg')) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
    });

    // Search
    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        render();
    });

    // Sort
    sortBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            sortBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSort = btn.dataset.sort;
            render();
        });
    });

    // View toggle
    viewBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            viewBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentView = parseInt(btn.dataset.cols);
            gallery.className = 'gallery grid-' + currentView;
        });
    });

    // ── Init ──
    async function init() {
        try {
            const resp = await fetch('./files.json');
            if (resp.ok) {
                FILES = await resp.json();
            } else {
                throw new Error('fetch failed');
            }
        } catch (e) {
            console.warn('fetch files.json 失败，使用 files.js 内嵌数据', e);
            FILES = window.__FILES || [];
        }
        render();
    }
    init();

    // Refresh on resize for tilt recalibration
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (tiltEnabled) {
                document.querySelectorAll('.card.tilt-active').forEach(c => c.style.transform = '');
            }
        }, 200);
    });
})();
</script>
</body>
</html>
