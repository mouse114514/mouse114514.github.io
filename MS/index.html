<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Resources · Ouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(255,255,255,0.95);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #2563eb; }

        /* Header */
        .page-header {
            padding: 100px 32px 32px;
            text-align: center;
        }
        .page-header h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: -1px;
        }
        .page-header p {
            margin-top: 8px;
            font-size: 15px;
            color: #9ca3af;
        }
        .stats {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            color: #9ca3af;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 32px 24px;
            flex-wrap: wrap;
        }
        .search-box {
            position: relative;
            width: 300px;
            max-width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            color: #1a1a2e;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input::placeholder { color: #9ca3af; }
        .search-box input:focus { border-color: #2563eb; }
        .search-box .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
        }

        .sort-group {
            display: flex;
            gap: 4px;
        }
        .sort-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #6b7280;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .sort-btn:hover { border-color: #d1d5db; color: #1a1a2e; }
        .sort-btn.active {
            border-color: #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        .view-toggle {
            display: flex;
            gap: 2px;
            background: #f3f4f6;
            border-radius: 8px;
            padding: 3px;
        }
        .view-toggle button {
            width: 32px; height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .view-toggle button.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .view-toggle button:hover { color: #1a1a2e; }

        /* Gallery */
        .gallery-wrap {
            padding: 0 24px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .gallery {
            display: grid;
            gap: 16px;
        }
        .gallery.grid-4 { grid-template-columns: repeat(4, 1fr); }
        .gallery.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .gallery.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .gallery.grid-1 { grid-template-columns: repeat(1, 1fr); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #9ca3af;
            font-size: 15px;
        }

        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            aspect-ratio: 4 / 3;
        }
        .card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
            transform: translateY(-2px);
        }

        .card-link {
            display: block;
            width: 100%; height: 100%;
            text-decoration: none;
            color: inherit;
        }

        .card-thumb {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .card-thumb img,
        .card-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .card:hover .card-thumb img,
        .card:hover .card-thumb video {
            transform: scale(1.04);
        }
        .card-thumb .file-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0.4;
        }
        .card-thumb .file-type-badge {
            position: absolute;
            top: 10px; right: 10px;
            padding: 3px 10px;
            border-radius: 6px;
            background: #ffffff;
            font-size: 11px;
            font-weight: 600;
            color: #2563eb;
            border: 1px solid #e5e7eb;
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 14px 12px;
            background: linear-gradient(transparent, rgba(255,255,255,0.95));
        }
        .card-info .name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #1a1a2e;
        }
        .card-info .meta {
            display: flex;
            gap: 10px;
            margin-top: 3px;
            font-size: 11px;
            color: #9ca3af;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .lightbox.active { display: flex; }
        .lightbox-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active .lightbox-bg { opacity: 1; }
        .lightbox-content {
            position: relative;
            z-index: 2;
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .lightbox.active .lightbox-content {
            transform: scale(1);
            opacity: 1;
        }
        .lightbox-content img,
        .lightbox-content video {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
        }
        .lightbox-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 24px;
            background: linear-gradient(transparent, rgba(255,255,255,0.95));
            z-index: 3;
        }
        .lightbox-info .name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .lightbox-info .meta {
            display: flex;
            gap: 16px;
            margin-top: 4px;
            font-size: 13px;
            color: #9ca3af;
        }
        .lightbox-close {
            position: absolute;
            top: 16px; right: 16px;
            z-index: 3;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .lightbox-close:hover { color: #1a1a2e; border-color: #d1d5db; }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0;
        }
        .lightbox:hover .lightbox-nav { opacity: 1; }
        .lightbox-nav:hover { color: #2563eb; border-color: #bfdbfe; }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        /* Shimmer */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .card.loading .card-thumb {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @media (max-width: 1200px) {
            .gallery.grid-4 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .gallery.grid-4, .gallery.grid-3 { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .sort-group { justify-content: center; }
            .lightbox-nav { opacity: 1; width: 36px; height: 36px; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
        }
        @media (max-width: 500px) {
            .gallery.grid-4, .gallery.grid-3, .gallery.grid-2 { grid-template-columns: 1fr; }
            .page-header { padding: 80px 16px 20px; }
            .gallery-wrap { padding: 0 12px 40px; }
            .card { aspect-ratio: auto; height: 220px; }
        }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="../index.html">Ouse</a>
    <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="#">Resources</a>
    </div>
</nav>

<header class="page-header">
    <h1>Resources</h1>
    <p>Art assets and miscellaneous files</p>
    <div class="stats">
        <span id="fileCount">0 files</span>
        <span id="imageCount">0 images</span>
        <span id="totalSize">0 KB</span>
    </div>
</header>

<div class="controls">
    <div class="search-box">
        <span class="icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search files..." autocomplete="off">
    </div>
    <div class="sort-group">
        <button class="sort-btn active" data-sort="name">Name</button>
        <button class="sort-btn" data-sort="time">Time</button>
        <button class="sort-btn" data-sort="size">Size</button>
        <button class="sort-btn" data-sort="type">Type</button>
    </div>
    <div class="view-toggle">
        <button data-cols="4" class="active" title="Grid">&#8862;</button>
        <button data-cols="2" title="Large">&#8863;</button>
        <button data-cols="1" title="List">&#9776;</button>
    </div>
</div>

<div class="gallery-wrap">
    <div class="gallery grid-4" id="gallery"></div>
</div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-bg"></div>
    <button class="lightbox-close" id="lbClose">&times;</button>
    <button class="lightbox-nav prev" id="lbPrev">&#8249;</button>
    <button class="lightbox-nav next" id="lbNext">&#8250;</button>
    <div class="lightbox-content" id="lbContent"></div>
    <div class="lightbox-info" id="lbInfo">
        <div class="name" id="lbName"></div>
        <div class="meta" id="lbMeta"></div>
    </div>
</div>

<script src="./files.js"></script>
<script>
(function() {
    let FILES = [];
    const RES_DIR = '../res/';

    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('searchInput');
    const sortBtns = document.querySelectorAll('.sort-btn');
    const viewBtns = document.querySelectorAll('.view-toggle button');
    const lightbox = document.getElementById('lightbox');
    const lbContent = document.getElementById('lbContent');
    const lbName = document.getElementById('lbName');
    const lbMeta = document.getElementById('lbMeta');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const fileCount = document.getElementById('fileCount');
    const imageCount = document.getElementById('imageCount');
    const totalSize = document.getElementById('totalSize');

    let currentSort = 'name';
    let currentView = 4;
    let searchQuery = '';
    let currentIndex = -1;
    let filteredFiles = [];

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatTime(iso) {
        const d = new Date(iso);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getExt(name) {
        const i = name.lastIndexOf('.');
        return i > 0 ? name.slice(i+1).toLowerCase() : '';
    }

    function isImage(ext) {
        return ['jpg','jpeg','png','gif','webp','bmp','svg','ico'].includes(ext);
    }
    function isVideo(ext) {
        return ['mp4','webm','mov','avi','mkv'].includes(ext);
    }

    function getFileIcon(ext) {
        if (isImage(ext)) return '\uD83D\uDDBC';
        if (isVideo(ext)) return '\uD83C\uDFAC';
        if (['mp3','wav','flac','ogg'].includes(ext)) return '\uD83C\uDFB5';
        if (['pdf'].includes(ext)) return '\uD83D\uDCC4';
        if (['zip','rar','7z','gz'].includes(ext)) return '\uD83D\uDCE6';
        if (['json','xml','yaml'].includes(ext)) return '\uD83D\uDCCB';
        return '\uD83D\uDCC1';
    }

    function getSortedFiltered() {
        let list = [...FILES];
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            list = list.filter(f => f.name.toLowerCase().includes(q));
        }
        list.sort((a, b) => {
            switch (currentSort) {
                case 'name': return a.name.localeCompare(b.name);
                case 'time': return new Date(b.time) - new Date(a.time);
                case 'size': return b.size - a.size;
                case 'type': return getExt(a.name).localeCompare(getExt(b.name));
                default: return 0;
            }
        });
        return list;
    }

    function render() {
        const list = getSortedFiltered();
        filteredFiles = list;

        fileCount.textContent = list.length + ' files';
        let imgCount = 0, totalBytes = 0;
        FILES.forEach(f => { totalBytes += f.size; if (isImage(getExt(f.name))) imgCount++; });
        imageCount.textContent = imgCount + ' images';
        totalSize.textContent = formatSize(totalBytes);

        if (list.length === 0) {
            gallery.innerHTML = '<div class="empty-state">No matching files</div>';
            return;
        }

        gallery.innerHTML = '';
        list.forEach((f, idx) => {
            const ext = getExt(f.name);
            const img = isImage(ext);
            const vid = isVideo(ext);

            const card = document.createElement('div');
            card.className = 'card';

            const thumb = document.createElement('div');
            thumb.className = 'card-thumb';

            if (img) {
                const imgEl = document.createElement('img');
                imgEl.loading = 'lazy';
                imgEl.src = RES_DIR + f.name;
                imgEl.alt = f.name;
                imgEl.onerror = function() {
                    this.style.display = 'none';
                    const icon = document.createElement('div');
                    icon.className = 'file-icon';
                    icon.textContent = '\uD83D\uDDBC';
                    thumb.appendChild(icon);
                };
                thumb.appendChild(imgEl);
            } else if (vid) {
                const vidEl = document.createElement('video');
                vidEl.preload = 'metadata';
                vidEl.muted = true;
                vidEl.loop = true;
                const src = document.createElement('source');
                src.src = RES_DIR + f.name;
                vidEl.appendChild(src);
                thumb.appendChild(vidEl);
                card.addEventListener('mouseenter', () => vidEl.play().catch(() => {}));
                card.addEventListener('mouseleave', () => { vidEl.pause(); vidEl.currentTime = 0; });
            } else {
                const icon = document.createElement('div');
                icon.className = 'file-icon';
                icon.textContent = getFileIcon(ext);
                thumb.appendChild(icon);
            }

            const badge = document.createElement('div');
            badge.className = 'file-type-badge';
            badge.textContent = ext.toUpperCase() || '?';
            thumb.appendChild(badge);

            const info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = `
                <div class="name">${f.name}</div>
                <div class="meta">
                    <span>${formatSize(f.size)}</span>
                    <span>${formatTime(f.time)}</span>
                </div>
            `;

            const link = document.createElement('a');
            link.className = 'card-link';
            link.href = RES_DIR + f.name;
            link.target = '_blank';
            link.appendChild(thumb);
            link.appendChild(info);

            card.appendChild(link);

            if (img || vid) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    openLightbox(idx);
                });
            }

            gallery.appendChild(card);
        });
    }

    function openLightbox(idx) {
        currentIndex = idx;
        const f = filteredFiles[idx];
        if (!f) return;
        const ext = getExt(f.name);
        const img = isImage(ext);
        const vid = isVideo(ext);

        lbContent.innerHTML = '';
        if (img) {
            const imgEl = document.createElement('img');
            imgEl.src = RES_DIR + f.name;
            imgEl.alt = f.name;
            lbContent.appendChild(imgEl);
        } else if (vid) {
            const vidEl = document.createElement('video');
            vidEl.controls = true;
            vidEl.autoplay = true;
            const src = document.createElement('source');
            src.src = RES_DIR + f.name;
            vidEl.appendChild(src);
            lbContent.appendChild(vidEl);
        }

        lbName.textContent = f.name;
        lbMeta.innerHTML = `<span>${formatSize(f.size)}</span><span>${formatTime(f.time)}</span><span>${ext.toUpperCase()}</span>`;

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        const media = lbContent.querySelector('video');
        if (media) media.pause();
    }

    function navLightbox(dir) {
        if (filteredFiles.length === 0) return;
        let newIdx = currentIndex + dir;
        if (newIdx < 0) newIdx = filteredFiles.length - 1;
        if (newIdx >= filteredFiles.length) newIdx = 0;
        openLightbox(newIdx);
    }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => navLightbox(-1));
    lbNext.addEventListener('click', () => navLightbox(1));

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-bg')) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
    });

    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        render();
    });

    sortBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            sortBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSort = btn.dataset.sort;
            render();
        });
    });

    viewBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            viewBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentView = parseInt(btn.dataset.cols);
            gallery.className = 'gallery grid-' + currentView;
        });
    });

    async function init() {
        try {
            const resp = await fetch('./files.json');
            if (resp.ok) {
                FILES = await resp.json();
            } else {
                throw new Error('fetch failed');
            }
        } catch (e) {
            console.warn('fetch files.json failed, using files.js fallback', e);
            FILES = window.__FILES || [];
        }
        render();
    }
    init();
})();
</script>
</body>
</html>
