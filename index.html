<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Ouse</title>
    <style>
        :root {
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --blue-dark: #1d4ed8;
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--white);
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== NAV ===== */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 48px);
            z-index: 1000;
            transition: background 0.3s;
        }
        .nav-brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--gray-900);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-brand span {
            background: linear-gradient(135deg, var(--blue), #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-500);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: var(--gray-900); background: var(--gray-100); }

        .lang-switch {
            display: flex;
            background: var(--gray-100);
            border-radius: 8px;
            padding: 3px;
        }
        .lang-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--gray-400);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--white);
            color: var(--gray-900);
            box-shadow: var(--shadow-sm);
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            padding: clamp(140px, 20vh, 220px) 32px 80px;
            text-align: center;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--blue-50);
            border: 1px solid var(--blue-100);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hero-badge .dot {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .hero-name {
            font-size: clamp(72px, 18vw, 160px);
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 0.95;
            background: linear-gradient(180deg, var(--gray-900) 0%, var(--gray-600) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hero-sub {
            font-size: clamp(18px, 3vw, 26px);
            color: var(--gray-400);
            font-weight: 400;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hero-desc {
            margin-top: 24px;
            font-size: 17px;
            color: var(--gray-500);
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
            opacity: 0;
            animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            justify-content: center;
            gap: clamp(32px, 6vw, 72px);
            padding: 48px 32px 0;
            opacity: 0;
            animation: fadeUp 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .stat { text-align: center; }
        .stat-num {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--blue), #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-label {
            font-size: 13px;
            color: var(--gray-400);
            font-weight: 500;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== SECTION ===== */
        .section-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gray-200), transparent);
            margin: 64px 0 0;
        }
        section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 64px clamp(20px, 4vw, 48px) 80px;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--gray-400);
        }
        .section-count {
            font-size: 13px;
            color: var(--gray-300);
            font-weight: 500;
        }

        /* ===== MOD CARDS ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .mod-card {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 18px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            background: var(--white);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .mod-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(37,99,235,0.03), rgba(124,58,237,0.03));
            opacity: 0;
            transition: opacity 0.35s;
        }
        .mod-card:hover {
            border-color: var(--blue-100);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(37,99,235,0.06);
            transform: translateY(-4px);
        }
        .mod-card:hover::before { opacity: 1; }

        .mod-icon-wrap {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 14px;
            background: var(--gray-50);
            border: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.35s;
        }
        .mod-card:hover .mod-icon-wrap {
            border-color: var(--blue-100);
            box-shadow: 0 0 0 3px var(--blue-50);
        }
        .mod-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .mod-card:hover .mod-icon {
            transform: scale(1.12);
        }
        .mod-info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }
        .mod-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .mod-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }
        .mod-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            background: var(--blue-50);
            color: var(--blue);
            white-space: nowrap;
        }
        .mod-desc {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.7;
            margin-bottom: 14px;
        }
        .mod-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--blue);
            font-weight: 600;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mod-link svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mod-card:hover .mod-link {
            opacity: 1;
            transform: translateX(0);
        }
        .mod-card:hover .mod-link svg {
            transform: translateX(3px);
        }

        /* ===== FOOTER ===== */
        footer {
            border-top: 1px solid var(--gray-100);
            padding: 48px clamp(20px, 4vw, 48px);
        }
        .footer-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .footer-brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .footer-brand span {
            background: linear-gradient(135deg, var(--blue), #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .footer-links {
            display: flex;
            gap: 24px;
        }
        .footer-links a {
            font-size: 13px;
            color: var(--gray-400);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--gray-900); }
        .footer-copy {
            font-size: 13px;
            color: var(--gray-300);
        }

        /* ===== SCROLL ANIM ===== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .hero { padding: 120px 16px 40px; }
            .stats { gap: 24px; flex-wrap: wrap; }
            .card-grid { grid-template-columns: 1fr; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .footer-inner { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav id="nav">
        <a class="nav-brand" href="#"><span>Ouse</span></a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="#mods" data-i18n="nav_mods">Mods</a>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-badge">
            <span class="dot"></span>
            <span data-i18n="hero_badge">Casualties Unknown Mod Developer</span>
        </div>
        <div class="hero-name">Ouse</div>
        <div class="hero-sub" data-i18n="hero_sub">独立开发者</div>
        <div class="hero-desc" data-i18n="hero_desc">打造性能优化工具、反作弊系统与游戏玩法增强。<br>专注于 Casualties Unknown 的模组开发。</div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-num" data-count="7">0</div>
            <div class="stat-label" data-i18n="stat_mods">Mods</div>
        </div>
        <div class="stat">
            <div class="stat-num" data-count="4">0</div>
            <div class="stat-label" data-i18n="stat_categories">Categories</div>
        </div>
        <div class="stat">
            <div class="stat-num" data-count="2026">0</div>
            <div class="stat-label" data-i18n="stat_since">Since</div>
        </div>
    </div>

    <div class="section-divider"></div>

    <section id="mods">
        <div class="section-header">
            <div class="section-title" data-i18n="section_mods">Mods</div>
            <div class="section-count">7 <span data-i18n="section_projects">projects</span></div>
        </div>
        <div class="card-grid" id="modsGrid"></div>
    </section>

    <footer>
        <div class="footer-inner">
            <div class="footer-brand"><span>Ouse</span></div>
            <div class="footer-links">
                <a href="https://www.nexusmods.com/scavprototype" target="_blank" rel="noopener">Nexus Mods</a>
                <a href="https://github.com/mouse114514" target="_blank" rel="noopener">GitHub</a>
            </div>
            <div class="footer-copy">&copy; 2026 Ouse. All rights reserved.</div>
        </div>
    </footer>

    <script>
        const i18n = {
            zh: {
                nav_mods: '模组',
                hero_badge: 'Casualties Unknown 模组开发者',
                hero_sub: '独立开发者',
                hero_desc: '打造性能优化工具、反作弊系统与游戏玩法增强。<br>专注于 Casualties Unknown 的模组开发。',
                stat_mods: '个模组',
                stat_categories: '个类别',
                stat_since: '年启动',
                section_mods: '模组',
                section_projects: '个项目',
                view_nexus: '在 N网 查看',
                tag_perf: '性能',
                tag_net: '网络',
                tag_content: '内容',
                tag_tool: '工具',
                tag_ai: 'AI'
            },
            en: {
                nav_mods: 'Mods',
                hero_badge: 'Casualties Unknown Mod Developer',
                hero_sub: 'Independent Developer',
                hero_desc: 'Building performance tools, anti-cheat systems, and gameplay enhancements.<br>Focused on mod development for Casualties Unknown.',
                stat_mods: 'Mods',
                stat_categories: 'Categories',
                stat_since: 'Active Since',
                section_mods: 'Mods',
                section_projects: 'projects',
                view_nexus: 'View on Nexus Mods',
                tag_perf: 'Performance',
                tag_net: 'Network',
                tag_content: 'Content',
                tag_tool: 'Tool',
                tag_ai: 'AI'
            }
        };

        const mods = [
            {
                icon: 'icons/CU_Noita.png',
                name: 'CU Noita',
                tag: 'tag_content',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/625',
                desc: { zh: '将 Noita 的物理模拟与像素破坏带入 Casualties Unknown，体验真实的物理交互与环境破坏', en: 'Brings Noita-style physics simulation and pixel destruction into Casualties Unknown for real physical interactions' }
            },
            {
                icon: 'icons/BlassM.png',
                name: 'BlassM',
                tag: 'tag_tool',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/624',
                desc: { zh: '游戏内性能基准测试工具，运行非阻塞性能探测，支持分类过滤与详细计时', en: 'In-game benchmarking tool with non-blocking performance probes, category filtering and detailed timing' }
            },
            {
                icon: 'icons/GlassN.png',
                name: 'GlassN',
                tag: 'tag_net',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/593',
                desc: { zh: '多人游戏网络优化：哈希缓冲复用、快速压缩、距离裁剪同步、空闲跳过', en: 'Multiplayer network optimization: hash buffer reuse, fast deflate, distance-culled sync, idle skip' }
            },
            {
                icon: 'icons/GlassM.png',
                name: 'GlassM',
                tag: 'tag_perf',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/580',
                desc: { zh: '世界生成核心优化：地形生成、实体放置、区块流式加载与光照系统', en: 'Core world generation optimization: terrain, entity placement, chunk streaming and lighting system' }
            },
            {
                icon: 'icons/RedStoneCraft.png',
                name: 'RedStone Craft',
                tag: 'tag_content',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/555',
                desc: { zh: '红石电路与机械合成系统，添加自动化与工程玩法', en: 'Redstone circuitry and mechanical crafting system, adding automation and engineering gameplay' }
            },
            {
                icon: 'icons/Cu-BloodBank.png',
                name: 'Cu-BloodBank',
                tag: 'tag_content',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/551',
                desc: { zh: '血液资源管理与存储系统，扩展游戏内的资源机制', en: 'Blood resource management and storage system, extending in-game resource mechanics' }
            },
            {
                icon: 'icons/CUMCPB.png.png',
                name: 'CU-MCP-Bridge',
                tag: 'tag_ai',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/526',
                desc: { zh: 'MCP 协议桥接层，让 AI agent 能直接控制游戏收发消息与交互', en: 'MCP protocol bridge layer enabling AI agents to directly control game messaging and interaction' }
            }
        ];

        let currentLang = localStorage.getItem('lang') || 'zh';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
            });
            renderMods();
        }

        function t(key) { return i18n[currentLang][key] || key; }

        function renderMods() {
            const grid = document.getElementById('modsGrid');
            grid.innerHTML = '';
            mods.forEach((mod, i) => {
                const a = document.createElement('a');
                a.className = 'mod-card reveal';
                a.href = mod.nexus;
                a.target = '_blank';
                a.rel = 'noopener';
                a.style.transitionDelay = `${i * 0.06}s`;
                a.innerHTML = `
                    <div class="mod-icon-wrap">
                        <img class="mod-icon" src="${mod.icon}" alt="${mod.name}" loading="lazy">
                    </div>
                    <div class="mod-info">
                        <div class="mod-head">
                            <div class="mod-name">${mod.name}</div>
                            <span class="mod-tag">${t(mod.tag)}</span>
                        </div>
                        <div class="mod-desc">${mod.desc[currentLang]}</div>
                        <span class="mod-link">
                            ${t('view_nexus')}
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
                        </span>
                    </div>
                `;
                grid.appendChild(a);
            });
            observeCards();
        }

        /* Scroll reveal */
        function observeCards() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        /* Counter animation */
        function animateCounters() {
            document.querySelectorAll('.stat-num[data-count]').forEach(el => {
                const target = parseInt(el.dataset.count);
                const duration = 1200;
                const start = performance.now();
                function step(now) {
                    const progress = Math.min((now - start) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(target * ease);
                    if (progress < 1) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            });
        }

        /* Nav shadow on scroll */
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('nav');
            if (window.scrollY > 20) {
                nav.style.boxShadow = '0 1px 3px rgba(0,0,0,0.06)';
            } else {
                nav.style.boxShadow = 'none';
            }
        });

        setLang(currentLang);
        animateCounters();

        document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
