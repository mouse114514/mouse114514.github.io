<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ouse</title>
    <style>
        :root {
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --blue-dark: #1d4ed8;
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--white);
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 48px); z-index: 1000;
            transition: box-shadow 0.3s;
        }
        .nav-brand { font-size: 20px; font-weight: 800; text-decoration: none; letter-spacing: -0.5px; }
        .nav-brand span { background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-right { display: flex; align-items: center; gap: 28px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { font-size: 14px; font-weight: 500; color: var(--gray-500); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a:hover { color: var(--gray-900); background: var(--gray-100); }
        .lang-switch { display: flex; background: var(--gray-100); border-radius: 8px; padding: 3px; }
        .lang-btn { padding: 6px 14px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; background: transparent; color: var(--gray-400); cursor: pointer; transition: all 0.25s; font-family: inherit; }
        .lang-btn.active { background: var(--white); color: var(--gray-900); box-shadow: var(--shadow-sm); }

        /* HERO */
        .hero { position: relative; padding: clamp(140px, 20vh, 220px) 32px 80px; text-align: center; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -40%; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%); pointer-events: none; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--blue); margin-bottom: 28px; opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-badge .dot { width: 7px; height: 7px; background: var(--blue); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        .hero-name { font-size: clamp(72px, 18vw, 160px); font-weight: 900; letter-spacing: -4px; line-height: 0.95; background: linear-gradient(180deg, var(--gray-900) 0%, var(--gray-600) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 20px; opacity: 0; animation: fadeUp 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-sub { font-size: clamp(18px, 3vw, 26px); color: var(--gray-400); font-weight: 400; letter-spacing: -0.5px; opacity: 0; animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-desc { margin-top: 24px; font-size: 17px; color: var(--gray-500); max-width: 540px; margin-left: auto; margin-right: auto; line-height: 1.8; opacity: 0; animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* STATS */
        .stats { display: flex; justify-content: center; gap: clamp(32px, 6vw, 72px); padding: 48px 32px 0; opacity: 0; animation: fadeUp 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stat { text-align: center; }
        .stat-num { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 13px; color: var(--gray-400); font-weight: 500; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        /* SECTION */
        .section-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--gray-200), transparent); margin: 64px 0 0; }
        section { max-width: 1080px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 48px) 80px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gray-400); }
        .section-count { font-size: 13px; color: var(--gray-300); font-weight: 500; }

        /* FILTER TABS */
        .filter-bar { display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
        .filter-btn { padding: 7px 18px; font-size: 13px; font-weight: 600; border: 1px solid var(--gray-200); border-radius: 100px; background: var(--white); color: var(--gray-500); cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .filter-btn:hover { border-color: var(--gray-300); color: var(--gray-700); }
        .filter-btn.active { background: var(--gray-900); color: var(--white); border-color: var(--gray-900); }

        /* MOD CARDS — large, detailed */
        .card-list { display: flex; flex-direction: column; gap: 20px; }
        .mod-card {
            position: relative;
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 28px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 32px;
            text-decoration: none;
            color: inherit;
            background: var(--white);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .mod-card::before {
            content: '';
            position: absolute; inset: 0; border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(37,99,235,0.02), rgba(124,58,237,0.02));
            opacity: 0; transition: opacity 0.35s;
        }
        .mod-card:hover { border-color: var(--blue-100); box-shadow: var(--shadow-lg), 0 0 0 1px rgba(37,99,235,0.06); transform: translateY(-3px); }
        .mod-card:hover::before { opacity: 1; }

        .mod-icon-wrap {
            width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 18px; background: var(--gray-50); border: 1px solid var(--gray-100);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: all 0.35s; position: relative; z-index: 1;
        }
        .mod-card:hover .mod-icon-wrap { border-color: var(--blue-100); box-shadow: 0 0 0 4px var(--blue-50); }
        .mod-icon { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .mod-card:hover .mod-icon { transform: scale(1.1); }

        .mod-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
        .mod-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
        .mod-name { font-size: 22px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px; }
        .mod-tag { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 100px; background: var(--blue-50); color: var(--blue); white-space: nowrap; }
        .mod-subtitle { font-size: 15px; color: var(--gray-600); font-weight: 500; margin-bottom: 14px; line-height: 1.5; }
        .mod-desc { font-size: 14px; color: var(--gray-500); line-height: 1.8; margin-bottom: 16px; }
        .mod-features { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .mod-feat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--gray-600); background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: 6px; padding: 5px 12px; }
        .mod-feat svg { width: 12px; height: 12px; color: var(--blue); flex-shrink: 0; }
        .mod-actions { display: flex; align-items: center; gap: 16px; }
        .mod-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--blue); font-weight: 600; transition: gap 0.3s; }
        .mod-link svg { width: 16px; height: 16px; transition: transform 0.3s; }
        .mod-card:hover .mod-link { gap: 10px; }
        .mod-card:hover .mod-link svg { transform: translateX(3px); }

        .mod-version { font-size: 12px; color: var(--gray-300); font-weight: 500; }

        /* FOOTER */
        footer { border-top: 1px solid var(--gray-100); padding: 48px clamp(20px, 4vw, 48px); }
        .footer-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .footer-brand { font-size: 16px; font-weight: 700; }
        .footer-brand span { background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { font-size: 13px; color: var(--gray-400); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--gray-900); }
        .footer-copy { font-size: 13px; color: var(--gray-300); }

        /* SCROLL ANIM */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 700px) {
            .hero { padding: 120px 16px 40px; }
            .stats { gap: 24px; flex-wrap: wrap; }
            .mod-card { grid-template-columns: 1fr; padding: 24px; gap: 16px; }
            .mod-icon-wrap { width: 64px; height: 64px; border-radius: 14px; }
            .mod-icon { width: 40px; height: 40px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .footer-inner { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>

                version: 'v1.2.2',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/551',
                subtitle: { zh: '血液资源管理与经济系统', en: 'Blood Resource Management & Economy' },
                desc: {
                    zh: '为 Casualties Unknown 添加血液系统：抽血/卖血机制。沙漠 1500ml、草地 500ml，卖血价格随累计卖血量递增（阶梯价格 4~23.5）。低卖血量时自动触发首次卖血选项，卖血价格超过 60 时有人拒绝交易。包含血袋标签、失血惩罚、血库系统兼容（Alexx MedicalBrutalism 联动）、中/繁/英三语。',
                    en: 'Adds a blood system to Casualties Unknown: blood extraction/selling mechanics. Desert 1500ml, grassland 500ml. Selling price increases with cumulative volume (tiered pricing 4~23.5). Triggers first-time sell option at low volume, NPCs refuse when price exceeds 60. Includes blood bag labels, blood loss penalties, blood bank system compatibility (Alexx MedicalBrutalism crossover), CN/Traditional/EN trilingual.'
                },
                features: {
                    zh: ['抽血/卖血', '阶梯价格', '血袋标签', '失血惩罚', 'Alexx 兼容', '三语'],
                    en: ['Extract/Sell Blood', 'Tiered Pricing', 'Blood Labels', 'Blood Penalty', 'Alexx Compatible', 'Trilingual']
                }
            },
            {
                icon: 'icons/CUMCPB.png.png',
                name: 'CU-MCP-Bridge',
                tag: 'tag_ai',
                version: 'v1.0.0',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/526',
                subtitle: { zh: 'AI Agent 游戏控制桥接层', en: 'AI Agent Game Control Bridge' },
                desc: {
                    zh: 'MCP 协议桥接层，让 AI agent（如 opencode）能直接控制 Casualties Unknown。支持移动与动作（移动到坐标/跟随玩家/跳跃/使用物品/睡觉）、查询状态（游戏地图/位置/周围方块）、应急规则（自动卖血/自动治疗等由 AI 实时编排执行）。通过 F6 内置 GUI 可实时查看 AI 状态与周围信息。',
                    en: 'MCP protocol bridge enabling AI agents (e.g. opencode) to directly control Casualties Unknown. Supports movement & actions (move to coords / follow player / jump / use item / sleep), status queries (game map / position / surrounding blocks), and contingency rules (auto blood selling / auto healing — orchestrated and executed by AI in real-time). Built-in F6 GUI for live AI status and surroundings.'
                },
                features: {
                    zh: ['移动控制', '状态查询', '应急规则', 'F6 GUI', 'AI 实时编排'],
                    en: ['Move Control', 'State Query', 'Contingency Rules', 'F6 GUI', 'AI Orchestration']
                }
            }
        ];

        let currentLang = localStorage.getItem('lang') || 'zh';
        let currentFilter = 'all';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
            });
            renderFilters();
            renderMods();
        }

        function t(key) { return i18n[currentLang][key] || key; }

        function renderFilters() {
            const bar = document.getElementById('filterBar');
            const tags = ['all', ...new Set(mods.map(m => m.tag))];
            bar.innerHTML = tags.map(tag =>
                `<button class="filter-btn ${tag === currentFilter ? 'active' : ''}" onclick="setFilter('${tag}')">${tag === 'all' ? t('filter_all') : t(tag)}</button>`
            ).join('');
        }

        function setFilter(tag) {
            currentFilter = tag;
            renderFilters();
            renderMods();
        }

        function renderMods() {
            const grid = document.getElementById('modsGrid');
            grid.innerHTML = '';
            const filtered = currentFilter === 'all' ? mods : mods.filter(m => m.tag === currentFilter);
            filtered.forEach((mod, i) => {
                const card = document.createElement('div');
                card.className = 'mod-card reveal';
                card.style.transitionDelay = `${i * 0.06}s`;
                const feats = mod.features[currentLang].map(f => `<span class="mod-feat">${checkSvg}${f}</span>`).join('');
                card.innerHTML = `
                    <div class="mod-icon-wrap">
                        <img class="mod-icon" src="${mod.icon}" alt="${mod.name}" loading="lazy">
                    </div>
                    <div class="mod-body">
                        <div class="mod-head">
                            <div class="mod-name">${mod.name}</div>
                            <span class="mod-tag">${t(mod.tag)}</span>
                            <span class="mod-version">${mod.version}</span>
                        </div>
                        <div class="mod-subtitle">${mod.subtitle[currentLang]}</div>
                        <div class="mod-desc">${mod.desc[currentLang]}</div>
                        <div class="mod-features">${feats}</div>
                        <div class="mod-actions">
                            <a class="mod-link" href="${mod.nexus}" target="_blank" rel="noopener">
                                ${t('view_nexus')}
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            observeCards();
        }

        function observeCards() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        function animateCounters() {
            document.querySelectorAll('.stat-num[data-count]').forEach(el => {
                const target = parseInt(el.dataset.count);
                const duration = 1200;
                const start = performance.now();
                function step(now) {
                    const progress = Math.min((now - start) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(target * ease);
                    if (progress < 1) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            });
        }

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('nav');
            nav.style.boxShadow = window.scrollY > 20 ? '0 1px 3px rgba(0,0,0,0.06)' : 'none';
        });

        setLang(currentLang);
        animateCounters();

        document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
