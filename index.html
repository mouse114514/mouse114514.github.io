<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Ouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #2563eb; }

        /* Lang switcher */
        .lang-switch {
            display: flex;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .lang-btn {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: #2563eb;
            color: #ffffff;
        }
        .lang-btn:hover:not(.active) {
            color: #1a1a2e;
            background: #f3f4f6;
        }

        /* Hero */
        .hero {
            padding: 160px 32px 80px;
            text-align: center;
        }
        .hero-name {
            font-size: clamp(64px, 15vw, 140px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: #1a1a2e;
        }
        .hero-sub {
            margin-top: 12px;
            font-size: clamp(16px, 2.5vw, 22px);
            color: #6b7280;
            font-weight: 400;
        }
        .hero-desc {
            margin-top: 20px;
            font-size: 16px;
            color: #9ca3af;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        /* Section */
        section {
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 32px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2563eb;
            margin-bottom: 32px;
        }

        /* Project cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 4px 12px rgba(37,99,235,0.08);
        }
        .card-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        .card p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }
        .card-tag {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
        }

        /* Detail panel */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
        }
        .detail-overlay.active { display: block; }
        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 520px;
            max-height: 70vh;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 32px;
            z-index: 201;
            display: none;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .detail-panel.active { display: block; }
        .detail-panel h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a2e;
        }
        .detail-panel .content {
            font-size: 15px;
            line-height: 1.8;
            color: #4b5563;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .detail-panel .meta {
            display: flex;
            gap: 14px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 12px;
        }
        .detail-panel .close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 20px;
            color: #9ca3af;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .detail-panel .close:hover { color: #1a1a2e; }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 32px;
            font-size: 13px;
            color: #d1d5db;
            border-top: 1px solid #f3f4f6;
        }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            .hero { padding: 120px 16px 60px; }
            section { padding: 40px 16px; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a class="nav-brand" href="#">Ouse</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="#projects" data-i18n="nav_projects">Projects</a>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-name">Ouse</div>
        <div class="hero-sub" data-i18n="hero_sub">独立开发者</div>
        <div class="hero-desc" data-i18n="hero_desc">Casualties Unknown 模组开发者。打造性能优化工具、反作弊系统与游戏玩法增强。</div>
    </div>

    <section id="projects">
        <div class="section-title" data-i18n="section_projects">项目</div>
        <div class="card-grid" id="projectsGrid"></div>
    </section>

    <footer>Ouse &copy; 2026</footer>

    <div class="detail-overlay" id="detailOverlay"></div>
    <div class="detail-panel" id="detailPanel">
        <button class="close" id="closeBtn">&times;</button>
        <h3 id="detailTitle"></h3>
        <div class="content" id="detailContent"></div>
        <div class="meta">
            <span id="detailTag"></span>
        </div>
    </div>

    <script>
        const i18n = {
            zh: {
                nav_projects: '项目',
                hero_sub: '独立开发者',
                hero_desc: 'Casualties Unknown 模组开发者。打造性能优化工具、反作弊系统与游戏玩法增强。',
                section_projects: '项目',
                tag_performance: '性能优化',
                tag_anticheat: '反作弊',
                tag_framework: '框架',
                tag_content: '内容',
                tag_tool: '工具',
                glassm_desc: '世界生成优化。修补地形生成、实体放置、区块流式加载与光照。',
                glassm_detail: 'Casualties Unknown 核心世界生成优化模组。\n\n修补 WorldGeneration 方法（地形生成、实体放置、结构生成、更新、清除）和 GlobalDark，优化区块流式加载与光照。包含区块流式加载系统与诊断工具。\n\ngithub.com/mouse114514',
                shieldn_desc: '服务端反作弊，含物理沙箱回放、移动验证与自动踢出升级。',
                shieldn_detail: 'CU 多人游戏服务端反作弊与反利用系统。\n\n功能包括：基于物理沙箱回放的移动验证（检查点批处理）、速度/跳跃上限、穿墙扫描、违规积分自动踢出升级、交互距离加固、泛洪限速，以及回传权威位置给作弊者。\n\n硬依赖 KrokoshaCasualtiesMP。',
                glassfuck_desc: '极限 FPS 优化。禁用粒子、阴影，裁剪音频，强制休眠远距离实体。',
                glassfuck_detail: '极限 FPS/性能优化模组。不保证兼容性。\n\n禁用粒子、裁剪远距离音频、禁用阴影、简化渲染器、极力减少 Physics2D 迭代、强制休眠远距离实体、尝试对象池化，并可选输出性能诊断日志。\n\n软依赖 GlassM。',
                grassk_desc: '模组框架与管理器。加载外部模组包，提供命令系统、热重载与国际化。',
                grassk_detail: 'Casualties Unknown 模组框架/管理器。\n\n从 mods/ 文件夹加载外部模组包，提供命令系统、热重载支持、国际化、自定义物品与配方的内容注册器，以及协程/tick 运行器。作为 CU 的轻量级模组开发 SDK。',
                mechenhance_desc: '机械增强。设计台、自定义蓝图、机器与完整制作系统。',
                mechenhance_detail: 'CU 机械/制作增强模组。\n\n添加设计台（可放置工作站）、自定义蓝图、书面蓝图、机器、完整的制作配方系统（含存档/读档）、游戏内设计编辑器 UI（支持中英文切换）以及调试工具。',
                behavior_desc: '回放系统。录制与回放游戏过程，含自由视角与 UI 覆盖。',
                behavior_detail: 'Casualties Unknown 回放系统。\n\n录制与回放游戏过程、自由视角模式、UI 覆盖层。快捷键：F5 录制、F6 回放、F7 停止、Tab 自由视角。'
            },
            en: {
                nav_projects: 'Projects',
                hero_sub: 'Independent Developer',
                hero_desc: 'Casualties Unknown mod developer. Building performance tools, anti-cheat systems, and gameplay enhancements.',
                section_projects: 'Projects',
                tag_performance: 'Performance',
                tag_anticheat: 'Anti-Cheat',
                tag_framework: 'Framework',
                tag_content: 'Content',
                tag_tool: 'Tool',
                glassm_desc: 'World generation optimization. Patches terrain gen, entity placement, chunk streaming and lighting.',
                glassm_detail: 'Core world-generation optimization mod for Casualties Unknown.\n\nPatches WorldGeneration methods (terrain gen, entity placement, structure gen, update, clear) and GlobalDark to optimize chunk streaming and lighting. Includes a chunk streaming system and diagnostics.\n\ngithub.com/mouse114514',
                shieldn_desc: 'Server-side anti-cheat with physics-sandbox replay, movement validation, and auto-kick escalation.',
                shieldn_detail: 'Server-side anti-cheat and anti-exploit system for CU multiplayer.\n\nFeatures movement validation with physics-sandbox replay (checkpoint batching), speed/jump capping, noclip swept-cast, VL violation scoring with auto-kick escalation, interaction distance hardening, flood-rate limiting, and kickback (resending authoritative position to cheaters).\n\nHard-depends on KrokoshaCasualtiesMP.',
                glassfuck_desc: 'Aggressive FPS optimization. Disables particles, shadows, culls audio, force-sleeps distant entities.',
                glassfuck_detail: 'Aggressive FPS/performance optimization mod. NO COMPATIBILITY GUARANTEED.\n\nDisables particles, culls distant audio, disables shadows, simplifies renderers, aggressively minimizes Physics2D iterations, force-sleeps distant entities, attempts object pooling, and optionally logs performance diagnostics.\n\nSoft-depends on GlassM.',
                grassk_desc: 'Mod framework and manager. Loads external mod packs, provides commands, hot-reload, i18n.',
                grassk_detail: 'Mod framework/manager for Casualties Unknown.\n\nLoads external mod packs from a mods/ folder, provides a command system, hot-reload support, i18n, content registrars for custom items and recipes, and a coroutine/tick runner. Acts as a lightweight modding SDK for CU.',
                mechenhance_desc: 'Mechanical enhancement. Design tables, custom blueprints, machines, and a full crafting system.',
                mechenhance_detail: 'Mechanical/crafting enhancement mod for CU.\n\nAdds Design Tables (placeable stations), custom blueprints, written blueprints, machines, a full crafting recipe system with save/load, an in-game design editor UI with language picker (CN/EN), and debug tools.',
                behavior_desc: 'Replay system. Record and replay gameplay with free-cam mode and UI overlay.',
                behavior_detail: 'Replay system for Casualties Unknown.\n\nRecord and replay gameplay, free-cam mode, UI overlay. Controls: F5 record, F6 replay, F7 stop, Tab free-cam.'
            }
        };

        const projects = [
            {
                id: 'glassm', icon: '⚡',
                nameKey: 'glassm', tagKey: 'tag_performance'
            },
            {
                id: 'shieldn', icon: '🛡',
                nameKey: 'shieldn', tagKey: 'tag_anticheat'
            },
            {
                id: 'glassfuck', icon: '🔥',
                nameKey: 'glassfuck', tagKey: 'tag_performance'
            },
            {
                id: 'grassk', icon: '🧩',
                nameKey: 'grassk', tagKey: 'tag_framework'
            },
            {
                id: 'mechenhance', icon: '⚙',
                nameKey: 'mechenhance', tagKey: 'tag_content'
            },
            {
                id: 'behavior', icon: '🎬',
                nameKey: 'behavior', tagKey: 'tag_tool'
            }
        ];

        let currentLang = localStorage.getItem('lang') || 'zh';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.textContent = i18n[lang][key];
            });

            renderCards();
        }

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function renderCards() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            projects.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <h3>${item.nameKey.charAt(0).toUpperCase() + item.nameKey.slice(1).replace(/([A-Z])/g, '$1')}</h3>
                    <p>${t(item.nameKey + '_desc')}</p>
                    <span class="card-tag">${t(item.tagKey)}</span>
                `;
                card.addEventListener('click', () => showDetail(item));
                grid.appendChild(card);
            });
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent =
                item.nameKey.charAt(0).toUpperCase() + item.nameKey.slice(1).replace(/([A-Z])/g, '$1');
            document.getElementById('detailContent').textContent = t(item.nameKey + '_detail');
            document.getElementById('detailTag').textContent = t(item.tagKey);
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('detailOverlay').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('detailOverlay').classList.remove('active');
        }

        setLang(currentLang);

        document.getElementById('detailOverlay').addEventListener('click', closeDetail);
        document.getElementById('closeBtn').addEventListener('click', closeDetail);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

        document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
