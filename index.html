<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X_studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0f1e;
            color: #e0e8f0;
            height: 100vh;
            overflow: hidden;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        /* Hero */
        .hero {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transform-style: preserve-3d;
        }
        .hero-x {
            font-size: clamp(100px, 25vw, 400px);
            font-weight: 900;
            background: linear-gradient(to bottom, #4da8ff, #b0e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            text-shadow: 0 0 40px rgba(77,168,255,0.3);
            transform-style: preserve-3d;
            user-select: none;
        }
        .hero-x.desktop { transition: transform 0.08s ease-out; }
        .hero-studio {
            font-size: clamp(28px, 4vw, 70px);
            color: white;
            font-weight: 400;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(77,168,255,0.2);
            margin-top: -10px;
            transform-style: preserve-3d;
            user-select: none;
        }
        .hero-studio.desktop { transition: transform 0.08s ease-out; }

        @keyframes xRotate {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            25% { transform: rotateX(-12deg) rotateY(18deg); }
            50% { transform: rotateX(0deg) rotateY(0deg); }
            75% { transform: rotateX(12deg) rotateY(-18deg); }
            100% { transform: rotateX(0deg) rotateY(0deg); }
        }
        @keyframes studioRotate {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            25% { transform: rotateX(-7deg) rotateY(11deg); }
            50% { transform: rotateX(0deg) rotateY(0deg); }
            75% { transform: rotateX(7deg) rotateY(-11deg); }
            100% { transform: rotateX(0deg) rotateY(0deg); }
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* Modal window */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            width: 90%;
            max-width: 680px;
            max-height: 80vh;
            background: rgba(16, 24, 44, 0.88);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(77, 168, 255, 0.15);
            border-radius: 24px;
            z-index: 51;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 80px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Traditional nav bar inside modal */
        .modal-nav {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            padding: 20px 24px 0;
            flex-shrink: 0;
        }
        .modal-nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-nav a:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }
        .modal-nav a.active {
            color: #4da8ff;
            background: rgba(77, 168, 255, 0.1);
        }

        /* Content area inside modal */
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 20px;
        }
        .modal-content .page {
            display: none;
        }
        .modal-content .page.active {
            display: block;
        }
        .modal-content .page h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #fff;
        }
        .modal-content .page p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        /* Card grid inside modal */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card:hover {
            border-color: rgba(77, 168, 255, 0.3);
            background: rgba(77, 168, 255, 0.06);
        }
        .card .icon { font-size: 24px; margin-bottom: 8px; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .card p { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 0; }

        /* Detail panel (over the modal) */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
        }
        .detail-overlay.active { display: block; }
        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 480px;
            max-height: 70vh;
            background: #141e32;
            border: 1px solid rgba(77, 168, 255, 0.3);
            border-radius: 20px;
            padding: 28px;
            z-index: 101;
            display: none;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .detail-panel.active { display: block; }
        .detail-panel h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, #b0e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .detail-panel .content {
            font-size: 15px;
            line-height: 1.8;
            color: rgba(255,255,255,0.8);
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .detail-panel .meta {
            display: flex;
            gap: 14px;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 12px;
        }
        .detail-panel .close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 20px;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.2s;
        }
        .detail-panel .close:hover { color: #fff; }

        @media (max-width: 640px) {
            .modal-nav { padding: 16px 16px 0; gap: 2px; }
            .modal-nav a { padding: 6px 12px; font-size: 13px; }
            .modal-content { padding: 16px; }
            .modal-content .page h2 { font-size: 19px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .detail-panel { padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- Hero -->
    <div class="hero" id="hero">
        <div class="hero-x" id="heroX">X</div>
        <div class="hero-studio" id="heroStudio">Studio</div>
    </div>

    <!-- Overlay + Modal -->
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
        <div class="modal-nav">
            <a class="active" data-page="projects">项目</a>
            <a data-page="members">成员</a>
            <a data-page="resources">资源</a>
            <a href="course/" style="color:rgba(255,255,255,0.35)">课程</a>
        </div>
        <div class="modal-content" id="modalContent">
            <div class="page active" id="page-projects">
                <h2>项目</h2>
                <p>我们正在做的东西</p>
                <div class="card-grid" id="projectsGrid"></div>
            </div>
            <div class="page" id="page-members">
                <h2>成员</h2>
                <p>社团的小伙伴们</p>
                <div class="card-grid" id="membersGrid"></div>
            </div>
            <div class="page" id="page-resources">
                <h2>资源</h2>
                <p>美术资源与素材</p>
                <div class="card-grid">
                    <a class="card" href="MS/" style="text-decoration:none;color:inherit;display:block">
                        <div class="icon">🖼</div>
                        <h3>资源库</h3>
                        <p>前往浏览</p>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail -->
    <div class="detail-overlay" id="detailOverlay"></div>
    <div class="detail-panel" id="detailPanel">
        <button class="close" id="closeBtn">&times;</button>
        <h3 id="detailTitle"></h3>
        <div class="content" id="detailContent"></div>
        <div class="meta">
            <span id="detailAuthor"></span>
            <span id="detailYear"></span>
        </div>
    </div>

    <script>
        const projects = [
            { id: 'betrayal', icon: '🎮', name: '背叛之下', desc: '一款《传说之下》同人游戏' },
            { id: 'beanWar', icon: '🌱', name: '豆子之战', desc: '跑酷为主，战斗为辅' },
            { id: 'mouseSlave', icon: '🤖', name: '老鼠奴隶', desc: '轻量 AI agent' }
        ];
        const members = [
            { id: 'mouse', icon: '🐭', name: '鼠标', desc: '程序员' },
            { id: 'krisid', icon: '🎨', name: '克斯里德', desc: '世界观设定与美术资源' },
            { id: 'zhousan', icon: '🖌', name: '粥伞', desc: '绘画' },
            { id: 'chuc', icon: '🎵', name: '出c好吃', desc: '作曲' },
            { id: 'qinglong', icon: '🎨', name: '青龙狱碧', desc: '美术' },
            { id: 'bingkuai', icon: '🎨', name: '冰块', desc: '美术' },
            { id: 'emocez', icon: '🎭', name: 'EmoCez', desc: '美术 · 编曲 · 程序员' },
            { id: 'dotParen', icon: '👻', name: '.()', desc: '试玩并分享视频' }
        ];
        const details = {
            betrayal: { zh: '一款《传说之下》同人游戏，有着独特的世界观。目前正在制作中\n\n主要讲述了人类与怪物战争的世界，人类打败了怪物，并将怪物封印在了地底。一共掉进了8个人类，但第8个人类最后杀死了怪物国王，带着他的灵魂回到了地上。当第9个人类掉进地底世界的时候，这里完全变了样子......\n\n当这个人类不断的探索，才逐渐发现这个地方的怪物们似乎比传闻中的更可怕，他还见识到了其他未能被救出来的6个人类灵魂，但被怪物们掌控。这个人类的目的到底是什么？怪物们会如何看待这个人？这个人类会救出六魂吗？这一切都在尘埃之中散去，显现出来的是背叛。', author: 'X社团', year: '进行中' },
            beanWar: { zh: '为 @青冥山岚系统 制作的同人游戏！跑酷为主，战斗为辅，目前正在制作中', author: '青冥山岚 · X社团', year: '进行中' },
            mouseSlave: { zh: '一个轻量的 AI agent，目前正在小范围测试', author: '鼠标', year: 'Alpha' },
            mouse: { zh: '这是我！程序员', author: '核心组', year: '' },
            krisid: { zh: '世界观设定与美术资源', author: '美术/设定', year: '' },
            zhousan: { zh: '绘画', author: '画师', year: '' },
            chuc: { zh: '作曲', author: '音乐组', year: '' },
            qinglong: { zh: '美术', author: '画师', year: '' },
            bingkuai: { zh: '美术', author: '画师', year: '' },
            emocez: { zh: '美术加轻度编曲加未来程序员', author: '多面手', year: '' },
            dotParen: { zh: '试玩并分享诡异的视频', author: '未知领域', year: '' }
        };

        // 3D effects
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const heroX = document.getElementById('heroX');
        const heroStudio = document.getElementById('heroStudio');
        if (isMobile) {
            heroX.style.animation = 'xRotate 6s ease-in-out infinite';
            heroStudio.style.animation = 'studioRotate 6s ease-in-out infinite';
        } else {
            heroX.classList.add('desktop');
            heroStudio.classList.add('desktop');
            document.addEventListener('mousemove', (e) => {
                const rx = (window.innerHeight / 2 - e.clientY) / (window.innerHeight / 2) * -25;
                const ry = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2) * 35;
                heroX.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
                heroStudio.style.transform = `rotateX(${rx * 0.6}deg) rotateY(${ry * 0.6}deg)`;
            });
        }

        // Modal toggle
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('overlay');
        function openModal() { modal.classList.add('active'); overlay.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); overlay.classList.remove('active'); }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.modal') || e.target.closest('.detail-panel') || e.target.closest('.detail-overlay')) return;
            if (modal.classList.contains('active')) closeModal();
            else openModal();
        });
        overlay.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });

        // Nav tabs inside modal
        document.querySelectorAll('.modal-nav a[data-page]').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.modal-nav a').forEach(a => a.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.modal-content .page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + tab.dataset.page).classList.add('active');
            });
        });

        // Render cards
        function renderCards(containerId, items) {
            const grid = document.getElementById(containerId);
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="icon">${item.icon}</div><h3>${item.name}</h3><p>${item.desc}</p>`;
                card.addEventListener('click', () => showDetail(item.id));
                grid.appendChild(card);
            });
        }

        function showDetail(id) {
            const d = details[id];
            if (!d) return;
            document.getElementById('detailTitle').textContent = d.zh.split('\n')[0] || id;
            document.getElementById('detailContent').textContent = d.zh;
            document.getElementById('detailAuthor').textContent = d.author ? `👤 ${d.author}` : '';
            document.getElementById('detailYear').textContent = d.year ? `📅 ${d.year}` : '';
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('detailOverlay').classList.add('active');
        }
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('detailOverlay').classList.remove('active');
        }

        renderCards('projectsGrid', projects);
        renderCards('membersGrid', members);

        document.getElementById('detailOverlay').addEventListener('click', closeDetail);
        document.getElementById('closeBtn').addEventListener('click', closeDetail);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetail(); closeModal(); } });
    </script>
</body>
</html>
