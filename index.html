<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Ouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links a {
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #2563eb; }

        .lang-switch {
            display: flex;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .lang-btn {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn.active { background: #2563eb; color: #fff; }
        .lang-btn:hover:not(.active) { color: #1a1a2e; background: #f3f4f6; }

        .hero {
            padding: 160px 32px 60px;
            text-align: center;
        }
        .hero-name {
            font-size: clamp(64px, 15vw, 140px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: #1a1a2e;
        }
        .hero-sub {
            margin-top: 12px;
            font-size: clamp(16px, 2.5vw, 22px);
            color: #6b7280;
        }
        .hero-desc {
            margin-top: 20px;
            font-size: 16px;
            color: #9ca3af;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        section {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 32px 60px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2563eb;
            margin-bottom: 28px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .mod-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        .mod-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
            transform: translateY(-2px);
        }
        .mod-icon {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 1px solid #f3f4f6;
            background: #f9fafb;
            object-fit: contain;
            padding: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .mod-info {
            flex: 1;
            min-width: 0;
        }
        .mod-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .mod-desc {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .mod-link {
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .mod-link::after {
            content: '\2192';
            transition: transform 0.15s;
        }
        .mod-card:hover .mod-link::after {
            transform: translateX(3px);
        }

        footer {
            text-align: center;
            padding: 40px 32px;
            font-size: 13px;
            color: #d1d5db;
            border-top: 1px solid #f3f4f6;
        }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            .hero { padding: 120px 16px 40px; }
            section { padding: 24px 16px 40px; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a class="nav-brand" href="#">Ouse</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="#mods" data-i18n="nav_mods">Mods</a>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-name">Ouse</div>
        <div class="hero-sub" data-i18n="hero_sub">独立开发者</div>
        <div class="hero-desc" data-i18n="hero_desc">Casualties Unknown 模组开发者。打造性能优化工具、反作弊系统与游戏玩法增强。</div>
    </div>

    <section id="mods">
        <div class="section-title" data-i18n="section_mods">Mods</div>
        <div class="card-grid" id="modsGrid"></div>
    </section>

    <footer>Ouse &copy; 2026</footer>

    <script>
        const i18n = {
            zh: {
                nav_mods: '模组',
                hero_sub: '独立开发者',
                hero_desc: 'Casualties Unknown 模组开发者。打造性能优化工具、反作弊系统与游戏玩法增强。',
                section_mods: '模组',
                view_nexus: '在 N网 查看'
            },
            en: {
                nav_mods: 'Mods',
                hero_sub: 'Independent Developer',
                hero_desc: 'Casualties Unknown mod developer. Building performance tools, anti-cheat systems, and gameplay enhancements.',
                section_mods: 'Mods',
                view_nexus: 'View on Nexus Mods'
            }
        };

        const mods = [
            {
                icon: 'icons/CU_Noita.png',
                name: 'CU Noita',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/625',
                desc: { zh: '将 Noita 的物理模拟与像素破坏带入 Casualties Unknown', en: 'Brings Noita-style physics simulation and pixel destruction into Casualties Unknown' }
            },
            {
                icon: 'icons/BlassM.png',
                name: 'BlassM',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/624',
                desc: { zh: '游戏内性能基准测试工具，运行非阻塞性能探测', en: 'In-game benchmarking tool with non-blocking performance probes' }
            },
            {
                icon: 'icons/GlassN.png',
                name: 'GlassN',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/593',
                desc: { zh: '多人游戏网络优化：哈希复用、快速压缩、距离裁剪同步', en: 'Network optimization: hash reuse, fast deflate, distance-culled sync' }
            },
            {
                icon: 'icons/GlassM.png',
                name: 'GlassM',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/580',
                desc: { zh: '世界生成优化：地形、实体放置、区块流式加载与光照', en: 'World generation optimization: terrain, chunks, lighting' }
            },
            {
                icon: 'icons/RedStoneCraft.png',
                name: 'RedStone Craft',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/555',
                desc: { zh: '红石电路与机械合成系统', en: 'Redstone circuitry and mechanical crafting system' }
            },
            {
                icon: 'icons/Cu-BloodBank.png',
                name: 'Cu-BloodBank',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/551',
                desc: { zh: '血液资源管理与存储系统', en: 'Blood resource management and storage system' }
            },
            {
                icon: 'icons/CUMCPB.png.png',
                name: 'CU-MCP-Bridge',
                nexus: 'https://www.nexusmods.com/scavprototype/mods/526',
                desc: { zh: 'MCP 协议桥接，让 AI agent 与游戏交互', en: 'MCP protocol bridge for AI agent interaction with the game' }
            }
        ];

        let currentLang = localStorage.getItem('lang') || 'zh';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            renderMods();
        }

        function t(key) { return i18n[currentLang][key] || key; }

        function renderMods() {
            const grid = document.getElementById('modsGrid');
            grid.innerHTML = '';
            mods.forEach(mod => {
                const a = document.createElement('a');
                a.className = 'mod-card';
                a.href = mod.nexus;
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerHTML = `
                    <img class="mod-icon" src="${mod.icon}" alt="${mod.name}" loading="lazy">
                    <div class="mod-info">
                        <div class="mod-name">${mod.name}</div>
                        <div class="mod-desc">${mod.desc[currentLang]}</div>
                        <span class="mod-link">${t('view_nexus')}</span>
                    </div>
                `;
                grid.appendChild(a);
            });
        }

        setLang(currentLang);

        document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
