<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Ouse</title>
    <style>
        :root {
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --blue-dark: #1d4ed8;
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --radius: 18px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--white);
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 48px); z-index: 1000;
            transition: box-shadow 0.3s;
        }
        .nav-brand { font-size: 20px; font-weight: 800; text-decoration: none; letter-spacing: -0.5px; }
        .nav-brand span { background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-right { display: flex; align-items: center; gap: 28px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { font-size: 14px; font-weight: 500; color: var(--gray-500); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a:hover { color: var(--gray-900); background: var(--gray-100); }
        .lang-switch { display: flex; background: var(--gray-100); border-radius: 8px; padding: 3px; }
        .lang-btn { padding: 6px 14px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; background: transparent; color: var(--gray-400); cursor: pointer; transition: all 0.25s; font-family: inherit; }
        .lang-btn.active { background: var(--white); color: var(--gray-900); box-shadow: var(--shadow-sm); }

        /* HERO */
        .hero { position: relative; padding: clamp(140px, 20vh, 220px) 32px 80px; text-align: center; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -40%; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%); pointer-events: none; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--blue); margin-bottom: 28px; opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-badge .dot { width: 7px; height: 7px; background: var(--blue); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        .hero-name { font-size: clamp(72px, 18vw, 160px); font-weight: 900; letter-spacing: -4px; line-height: 0.95; background: linear-gradient(180deg, var(--gray-900) 0%, var(--gray-600) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 20px; opacity: 0; animation: fadeUp 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-sub { font-size: clamp(18px, 3vw, 26px); color: var(--gray-400); font-weight: 400; letter-spacing: -0.5px; opacity: 0; animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-desc { margin-top: 24px; font-size: 17px; color: var(--gray-500); max-width: 540px; margin-left: auto; margin-right: auto; line-height: 1.8; opacity: 0; animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* STATS */
        .stats { display: flex; justify-content: center; gap: clamp(32px, 6vw, 72px); padding: 48px 32px 0; opacity: 0; animation: fadeUp 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stat { text-align: center; }
        .stat-num { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 13px; color: var(--gray-400); font-weight: 500; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        /* SECTION */
        .section-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--gray-200), transparent); margin: 64px 0 0; }
        section { max-width: 1100px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 48px) 80px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gray-400); }
        .section-count { font-size: 13px; color: var(--gray-300); font-weight: 500; }

        /* FILTER TABS */
        .filter-bar { display: flex; gap: 6px; margin-bottom: 32px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 20px; font-size: 13px; font-weight: 600; border: 1px solid var(--gray-200); border-radius: 100px; background: var(--white); color: var(--gray-500); cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .filter-btn:hover { border-color: var(--gray-300); color: var(--gray-700); }
        .filter-btn.active { background: var(--gray-900); color: var(--white); border-color: var(--gray-900); }

        /* ========== MOD CARD — FULL WIDTH, LARGE ========== */
        .card-list { display: flex; flex-direction: column; gap: 24px; }
        .mod-card {
            position: relative;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background: var(--white);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .mod-card:hover { border-color: var(--blue-100); box-shadow: var(--shadow-lg), 0 0 0 1px rgba(37,99,235,0.06); }

        .mod-header {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 40px 44px 0;
        }
        .mod-icon-wrap {
            width: 100px; height: 100px; flex-shrink: 0;
            border-radius: 22px; background: var(--gray-50); border: 1px solid var(--gray-100);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: all 0.35s;
        }
        .mod-card:hover .mod-icon-wrap { border-color: var(--blue-100); box-shadow: 0 0 0 4px var(--blue-50); }
        .mod-icon { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .mod-card:hover .mod-icon { transform: scale(1.08); }

        .mod-head-text { flex: 1; min-width: 0; }
        .mod-top-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
        .mod-name { font-size: 28px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.7px; }
        .mod-tag { font-size: 12px; font-weight: 600; padding: 4px 14px; border-radius: 100px; background: var(--blue-50); color: var(--blue); white-space: nowrap; }
        .mod-version { font-size: 13px; color: var(--gray-300); font-weight: 500; }
        .mod-subtitle { font-size: 17px; color: var(--gray-600); font-weight: 500; line-height: 1.5; }

        .mod-link-row { padding: 0 44px; margin-top: 16px; }
        .mod-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--blue); font-weight: 600; text-decoration: none; transition: gap 0.3s; }
        .mod-link svg { width: 16px; height: 16px; transition: transform 0.3s; }
        .mod-link:hover { gap: 10px; }
        .mod-link:hover svg { transform: translateX(3px); }

        /* FEATURE CHIPS */
        .mod-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 20px 44px 0; }
        .mod-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--gray-600); background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: 8px; padding: 6px 14px; }
        .mod-chip svg { width: 13px; height: 13px; color: var(--blue); flex-shrink: 0; }

        /* DETAIL BODY */
        .mod-detail { padding: 28px 44px 40px; }
        .mod-detail h3 { font-size: 18px; font-weight: 700; color: var(--gray-900); margin: 28px 0 12px; letter-spacing: -0.3px; }
        .mod-detail h3:first-child { margin-top: 0; }
        .mod-detail p { font-size: 15px; color: var(--gray-600); line-height: 1.85; margin-bottom: 14px; }
        .mod-detail ul { padding-left: 22px; margin-bottom: 14px; }
        .mod-detail li { font-size: 15px; color: var(--gray-600); line-height: 1.85; margin-bottom: 4px; }
        .mod-detail li strong { color: var(--gray-800); font-weight: 600; }
        .mod-detail code { font-size: 13px; background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: 5px; padding: 2px 7px; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; color: var(--gray-700); }

        /* TABLE */
        .mod-table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: 14px; }
        .mod-table th { text-align: left; font-weight: 600; color: var(--gray-500); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 14px; border-bottom: 2px solid var(--gray-200); background: var(--gray-50); }
        .mod-table td { padding: 10px 14px; border-bottom: 1px solid var(--gray-100); color: var(--gray-600); }
        .mod-table tr:last-child td { border-bottom: none; }
        .mod-table .yes { color: #16a34a; font-weight: 600; }
        .mod-table .no { color: #dc2626; font-weight: 600; }

        /* SVG INVERT FILTER (hidden) */
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

        /* FOOTER */
        footer { border-top: 1px solid var(--gray-100); padding: 48px clamp(20px, 4vw, 48px); }
        .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .footer-brand { font-size: 16px; font-weight: 700; }
        .footer-brand span { background: linear-gradient(135deg, var(--blue), #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { font-size: 13px; color: var(--gray-400); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--gray-900); }
        .footer-copy { font-size: 13px; color: var(--gray-300); }

        /* SCROLL ANIM — slide in from left/right */
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
        .reveal { opacity: 0; }
        .reveal.from-left { transform: translateX(-80px); }
        .reveal.from-right { transform: translateX(80px); }
        .reveal.visible.from-left { animation: slideInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .reveal.visible.from-right { animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* TITLE CURSOR INVERT EFFECT */
        .mod-head-text { position: relative; }
        .mod-name-wrap {
            position: relative;
            display: inline-block;
            overflow: hidden;
            cursor: default;
        }
        .mod-name-text {
            position: relative;
            z-index: 1;
            transition: filter 0.15s;
        }
        .mod-name-wrap .invert-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            filter: url(#invert);
            background: var(--gray-100);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mod-name-wrap:hover .invert-circle {
            width: 140px;
            height: 60px;
        }
        .mod-name-wrap .invert-text {
            position: absolute;
            top: 0; left: 0;
            z-index: 3;
            color: var(--white);
            pointer-events: none;
            clip-path: circle(0px at 50% 50%);
            transition: clip-path 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mod-name-wrap:hover .invert-text {
            clip-path: circle(70px at var(--mx, 50%) var(--my, 50%));
        }

        @media (max-width: 700px) {
            .hero { padding: 120px 16px 40px; }
            .stats { gap: 24px; flex-wrap: wrap; }
            .mod-header { padding: 28px 24px 0; gap: 18px; }
            .mod-icon-wrap { width: 72px; height: 72px; }
            .mod-icon { width: 48px; height: 48px; }
            .mod-name { font-size: 22px; }
            .mod-chips, .mod-detail, .mod-link-row { padding-left: 24px; padding-right: 24px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .footer-inner { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

    const mods = [

            subtitle: { zh: '流式世界生成性能优化', en: 'Streaming World Generation Optimization' },
            chips: { zh: ['流式渲染','物理区动态开关','矿石走原版管线','出生点精确','无限岩保护','PerfDiag 诊断','联机兼容','结构修复'], en: ['Streaming Render','Dynamic Physics','Vanilla Ores','Precise Spawn','Infinite Rock Guard','PerfDiag Diagnostics','MP Compatible','Structural Fixes'] },
            detail: {
                zh: `<h3>概述</h3>
<p>将原版"全层一次性生成"替换为以玩家为中心的流式区块生成，大幅降低生成开销与物理负载。</p>

<h3>基准测试</h3>

<tr><td>中端 (i5)</td><td>移动中</td><td>184 FPS</td><td>227 FPS</td></tr>
</table>
<table class="mod-table">
<tr><th>设备</th><th>原版生成时间</th><th>GlassM 生成时间</th></tr>
<tr><td>低端 (骁龙 870 #1)</td><td>13 秒</td><td>7 秒</td></tr>
<tr><td>骁龙 870 #2</td><td>未知</td><td>5.6 秒</td></tr>
<tr><td>中端 (i5) — 首层</td><td>5 秒</td><td>3 秒</td></tr>
<tr><td>中端 (i5) — 后续层</td><td>未知</td><td>&lt; 1 秒</td></tr>
</table>

<h3>核心功能</h3>
<ul>
<li><strong>流式世界生成</strong>：区块按玩家（联机时含所有玩家）需求生成/卸载，消除全层加载，进入更快、运行更流畅</li>
<li><strong>预填地形数据 & 流式渲染</strong>：开局一次性预填全层地形数据（纯数组，开销极低），之后按需生成/卸载区块</li>

    /* ======================== RENDER ======================== */
    let currentLang = localStorage.getItem('lang') || 'zh';
    let currentFilter = 'all';

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
        });
        renderFilters();
        renderMods();
    }

    function renderFilters() {
        const bar = document.getElementById('filterBar');
        const tags = ['all', ...new Set(mods.map(m => m.tag))];
        bar.innerHTML = tags.map(tag =>
            `<button class="filter-btn ${tag === currentFilter ? 'active' : ''}" onclick="setFilter('${tag}')">${tag === 'all' ? t('filter_all') : t(tag)}</button>`
        ).join('');
    }

    function setFilter(tag) { currentFilter = tag; renderFilters(); renderMods(); }

    function renderMods() {
        const grid = document.getElementById('modsGrid');
        grid.innerHTML = '';
        const filtered = currentFilter === 'all' ? mods : mods.filter(m => m.tag === currentFilter);
        filtered.forEach((mod, i) => {
            const card = document.createElement('div');
            card.className = 'mod-card reveal';
            card.style.transitionDelay = `${i * 0.06}s`;

            const chips = mod.chips[currentLang].map(c => `<span class="mod-chip">${checkSvg}${c}</span>`).join('');

            card.innerHTML = `
                <div class="mod-header">
                    <div class="mod-icon-wrap">
                        <img class="mod-icon" src="${mod.icon}" alt="${mod.name}" loading="lazy">
                    </div>
                    <div class="mod-head-text">
                        <div class="mod-top-row">
                            <div class="mod-name-wrap" data-mod="${mod.name}">
                                <span class="mod-name-text mod-name">${mod.name}</span>
                                <span class="invert-circle"></span>
                                <span class="mod-name-text invert-text">${mod.name}</span>
                            </div>
                            <span class="mod-tag">${t(mod.tag)}</span>
                            <span class="mod-version">${mod.version}</span>
                        </div>
                        <div class="mod-subtitle">${mod.subtitle[currentLang]}</div>
                    </div>
                </div>
                <div class="mod-link-row">
                    <a class="mod-link" href="${mod.nexus}" target="_blank" rel="noopener">
                        ${t('view_nexus')} ${arrowSvg}
                    </a>
                </div>
                <div class="mod-chips">${chips}</div>
                <div class="mod-detail">${mod.detail[currentLang]}</div>
            `;
            grid.appendChild(card);
        });
        observeCards();
    }

    function observeCards() {
        document.querySelectorAll('.reveal').forEach((el, i) => {
            el.classList.add(i % 2 === 0 ? 'from-left' : 'from-right');
        });
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
            });
        }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        /* Title cursor invert tracking */
        document.querySelectorAll('.mod-name-wrap').forEach(wrap => {
            const text = wrap.querySelector('.invert-text');
            wrap.addEventListener('mousemove', e => {
                const r = wrap.getBoundingClientRect();
                const x = ((e.clientX - r.left) / r.width * 100);
                const y = ((e.clientY - r.top) / r.height * 100);
                wrap.style.setProperty('--mx', x + '%');
                wrap.style.setProperty('--my', y + '%');
                text.style.clipPath = `circle(40px at ${x}% ${y}%)`;
            });
            wrap.addEventListener('mouseleave', () => {
                text.style.clipPath = 'circle(0px at 50% 50%)';
            });
        });
    }

    function animateCounters() {
        document.querySelectorAll('.stat-num[data-count]').forEach(el => {
            const target = parseInt(el.dataset.count);
            const start = performance.now();
            function step(now) {
                const p = Math.min((now - start) / 1200, 1);
                el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        });
    }

    window.addEventListener('scroll', () => {
        document.getElementById('nav').style.boxShadow = window.scrollY > 20 ? '0 1px 3px rgba(0,0,0,0.06)' : 'none';
    });

    setLang(currentLang);
    animateCounters();
    document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' }); });
    });
    </script>
</body>
</html>
