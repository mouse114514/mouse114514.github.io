<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Ouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #2563eb; }

        /* Hero */
        .hero {
            padding: 160px 32px 80px;
            text-align: center;
        }
        .hero-name {
            font-size: clamp(64px, 15vw, 140px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: #1a1a2e;
        }
        .hero-sub {
            margin-top: 12px;
            font-size: clamp(16px, 2.5vw, 22px);
            color: #6b7280;
            font-weight: 400;
        }
        .hero-desc {
            margin-top: 20px;
            font-size: 16px;
            color: #9ca3af;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        /* Section */
        section {
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 32px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2563eb;
            margin-bottom: 32px;
        }

        /* Project cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 4px 12px rgba(37,99,235,0.08);
        }
        .card-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        .card p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }
        .card-tag {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
        }

        /* Detail panel */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
        }
        .detail-overlay.active { display: block; }
        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 520px;
            max-height: 70vh;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 32px;
            z-index: 201;
            display: none;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .detail-panel.active { display: block; }
        .detail-panel h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a2e;
        }
        .detail-panel .content {
            font-size: 15px;
            line-height: 1.8;
            color: #4b5563;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .detail-panel .meta {
            display: flex;
            gap: 14px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 12px;
        }
        .detail-panel .close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 20px;
            color: #9ca3af;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .detail-panel .close:hover { color: #1a1a2e; }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 32px;
            font-size: 13px;
            color: #d1d5db;
            border-top: 1px solid #f3f4f6;
        }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            .hero { padding: 120px 16px 60px; }
            section { padding: 40px 16px; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a class="nav-brand" href="#">Ouse</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="MS/">Resources</a>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-name">Ouse</div>
        <div class="hero-sub">Independent Developer</div>
        <div class="hero-desc">Casualties Unknown mod developer. Building performance tools, anti-cheat systems, and gameplay enhancements.</div>
    </div>

    <section id="projects">
        <div class="section-title">Projects</div>
        <div class="card-grid" id="projectsGrid"></div>
    </section>

    <footer>Ouse &copy; 2026</footer>

    <div class="detail-overlay" id="detailOverlay"></div>
    <div class="detail-panel" id="detailPanel">
        <button class="close" id="closeBtn">&times;</button>
        <h3 id="detailTitle"></h3>
        <div class="content" id="detailContent"></div>
        <div class="meta">
            <span id="detailTag"></span>
        </div>
    </div>

    <script>
        const projects = [
            {
                id: 'glassm',
                icon: '⚡',
                name: 'GlassM',
                tag: 'Performance',
                desc: 'World generation optimization. Patches terrain gen, entity placement, chunk streaming and lighting.',
                detail: 'Core world-generation optimization mod for Casualties Unknown.\n\nPatches WorldGeneration methods (terrain gen, entity placement, structure gen, update, clear) and GlobalDark to optimize chunk streaming and lighting. Includes a chunk streaming system and diagnostics.\n\ngithub.com/mouse114514'
            },
            {
                id: 'shieldn',
                icon: '🛡',
                name: 'ShieldN',
                tag: 'Anti-Cheat',
                desc: 'Server-side anti-cheat with physics-sandbox replay, movement validation, and auto-kick escalation.',
                detail: 'Server-side anti-cheat and anti-exploit system for CU multiplayer.\n\nFeatures movement validation with physics-sandbox replay (checkpoint batching), speed/jump capping, noclip swept-cast, VL violation scoring with auto-kick escalation, interaction distance hardening, flood-rate limiting, and kickback (resending authoritative position to cheaters).\n\nHard-depends on KrokoshaCasualtiesMP.'
            },
            {
                id: 'glassfuck',
                icon: '🔥',
                name: 'GlassFUCK',
                tag: 'Performance',
                desc: 'Aggressive FPS optimization. Disables particles, shadows, culls audio, force-sleeps distant entities.',
                detail: 'Aggressive FPS/performance optimization mod. NO COMPATIBILITY GUARANTEED.\n\nDisables particles, culls distant audio, disables shadows, simplifies renderers, aggressively minimizes Physics2D iterations, force-sleeps distant entities, attempts object pooling, and optionally logs performance diagnostics.\n\nSoft-depends on GlassM.'
            },
            {
                id: 'grassk',
                icon: '🧩',
                name: 'GrassK',
                tag: 'Framework',
                desc: 'Mod framework and manager. Loads external mod packs, provides commands, hot-reload, i18n.',
                detail: 'Mod framework/manager for Casualties Unknown.\n\nLoads external mod packs from a mods/ folder, provides a command system, hot-reload support, i18n, content registrars for custom items and recipes, and a coroutine/tick runner. Acts as a lightweight modding SDK for CU.'
            },
            {
                id: 'mechenhance',
                icon: '⚙',
                name: 'MechEnhance',
                tag: 'Content',
                desc: 'Mechanical enhancement. Design tables, custom blueprints, machines, and a full crafting system.',
                detail: 'Mechanical/crafting enhancement mod for CU.\n\nAdds Design Tables (placeable stations), custom blueprints, written blueprints, machines, a full crafting recipe system with save/load, an in-game design editor UI with language picker (CN/EN), and debug tools.'
            },
            {
                id: 'behavior',
                icon: '🎬',
                name: 'BehaviorIsntUnknown',
                tag: 'Tool',
                desc: 'Replay system. Record and replay gameplay with free-cam mode and UI overlay.',
                detail: 'Replay system for Casualties Unknown.\n\nRecord and replay gameplay, free-cam mode, UI overlay. Controls: F5 record, F6 replay, F7 stop, Tab free-cam.'
            }
        ];

        function renderCards() {
            const grid = document.getElementById('projectsGrid');
            projects.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <span class="card-tag">${item.tag}</span>
                `;
                card.addEventListener('click', () => showDetail(item));
                grid.appendChild(card);
            });
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent = item.name;
            document.getElementById('detailContent').textContent = item.detail;
            document.getElementById('detailTag').textContent = item.tag;
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('detailOverlay').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('detailOverlay').classList.remove('active');
        }

        renderCards();

        document.getElementById('detailOverlay').addEventListener('click', closeDetail);
        document.getElementById('closeBtn').addEventListener('click', closeDetail);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

        // Smooth scroll for nav links
        document.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
